<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>가온누리 전자계약</title>
<style>
  :root{
    --brand:#1d6f5a; --brand-dark:#155646; --brand-soft:#e8f3ef;
    --ink:#1c1c1e; --sub:#6b7280; --line:#e5e7eb; --bg:#f5f6f8;
    --danger:#c0392b; --done:#1d6f5a;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
    background:var(--bg); color:var(--ink); font-size:15px; line-height:1.6;
    padding-bottom:env(safe-area-inset-bottom);
  }
  .wrap{max-width:720px;margin:0 auto}
  header.top{
    background:var(--brand); color:#fff; padding:14px 16px; position:sticky; top:0; z-index:20;
    box-shadow:0 1px 6px rgba(0,0,0,.12);
  }
  header.top .brand{font-weight:700;font-size:17px;letter-spacing:-.2px}
  header.top .sub{font-size:12px;opacity:.85;margin-top:2px}
  .card{background:#fff;border-radius:14px;padding:16px;margin:12px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
  .card h2{font-size:16px;margin:0 0 10px;letter-spacing:-.3px}
  .card h3{font-size:14px;margin:16px 0 8px}
  .muted{color:var(--sub);font-size:13px}
  .row{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:14px}
  .row:last-child{border-bottom:none}
  .row .k{color:var(--sub);flex:0 0 auto}
  .row .v{text-align:right;font-weight:600}
  label.field{display:block;margin:12px 0 0}
  label.field span{display:block;font-size:13px;color:var(--sub);margin-bottom:5px}
  input[type=text],input[type=tel],input[type=date],input[type=password],textarea,select{
    width:100%;border:1px solid #d7dbe0;border-radius:10px;padding:11px 12px;font-size:15px;
    font-family:inherit;background:#fff;color:var(--ink)
  }
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(29,111,90,.12)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .terms{font-size:13px;color:#333;background:#fafbfc;border:1px solid var(--line);border-radius:10px;padding:12px;max-height:none}
  .terms p{margin:0 0 8px}
  .terms ol{padding-left:18px;margin:6px 0}
  .terms li{margin-bottom:6px}
  .agree{display:flex;align-items:flex-start;gap:9px;margin:10px 0;padding:10px;background:var(--brand-soft);border-radius:10px;font-size:13.5px}
  .agree input{width:20px;height:20px;margin:1px 0 0;accent-color:var(--brand);flex:0 0 auto}
  .signbox{border:2px dashed #c7cdd4;border-radius:12px;background:#fff;position:relative;overflow:hidden}
  canvas#pad{display:block;width:100%;height:180px;touch-action:none}
  .signhint{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;color:#b6bcc4;font-size:14px;pointer-events:none}
  .signbar{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
  button{
    font-family:inherit;font-size:15px;border:none;border-radius:11px;padding:13px 18px;
    background:var(--brand);color:#fff;font-weight:700;cursor:pointer
  }
  button:active{background:var(--brand-dark)}
  button.ghost{background:#fff;color:var(--brand);border:1px solid var(--brand)}
  button.small{padding:8px 12px;font-size:13px;border-radius:9px}
  button.gray{background:#eef0f2;color:#333}
  button:disabled{opacity:.5}
  .btnrow{display:flex;gap:10px;margin-top:16px}
  .btnrow button{flex:1}
  .hidden{display:none !important}
  .badge{display:inline-block;font-size:12px;padding:3px 9px;border-radius:20px;font-weight:700}
  .badge.wait{background:#fff3e0;color:#b26a00}
  .badge.done{background:#e6f4ee;color:var(--done)}
  .notice{margin:12px;padding:14px;border-radius:12px;font-size:14px}
  .notice.err{background:#fdecea;color:#a4281c}
  .notice.ok{background:#e6f4ee;color:#155646}
  .agree-ok{background:#e6f4ee}
  .agree-no{background:#f6f7f9}
  .list-item{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
  .list-item:last-child{border-bottom:none}
  .list-item .who{flex:1;min-width:0}
  .list-item .who b{display:block;font-size:15px}
  .list-item .who span{font-size:12.5px;color:var(--sub)}
  .pinpad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
  .pinpad button{background:#fff;color:var(--ink);border:1px solid var(--line);font-size:20px;font-weight:600;padding:14px 0}
  .pinpad button:active{background:#eef0f2}
  .dots{display:flex;gap:12px;justify-content:center;margin:14px 0 4px}
  .dots i{width:14px;height:14px;border-radius:50%;background:#dfe3e8;display:block}
  .dots i.on{background:var(--brand)}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:50}
  .modal .sheet{background:#fff;width:100%;max-width:720px;max-height:88vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px 16px 28px}
  .linkbox{display:flex;gap:8px;margin-top:10px}
  .linkbox input{flex:1;font-size:12.5px}
  .center{text-align:center}
  .check-big{font-size:44px;line-height:1;margin-bottom:8px}
  .stamp{display:inline-block;border:2px solid var(--done);color:var(--done);border-radius:10px;padding:6px 14px;font-weight:800;letter-spacing:2px;transform:rotate(-4deg)}
  table.mini{width:100%;border-collapse:collapse;font-size:13px}
  table.mini th,table.mini td{border:1px solid var(--line);padding:7px 8px;text-align:left}
  table.mini th{background:#f8f9fa;color:var(--sub);font-weight:600;width:38%}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">가온누리산후도우미</div>
    <div class="sub" id="topSub">산모·신생아 건강관리사 전자계약</div>
  </header>
  <div id="app"></div>
</div>

<script>
/* ============================================================
   가온누리 전자서명 프로토타입 (정적 화면)
   - 개인정보 없음: 계약서 항목만 들어 있고, 실제 데이터는 서버(Apps Script)에서 내려옵니다.
   - 관리자 PIN은 이 파일에 없습니다. 서버에서 검증합니다.
   ============================================================ */
var API = 'https://script.google.com/macros/s/AKfycbxNkgjaS8ERq4ZYywNroxxsROdofkLe6HEzxQDRnFSraBJGu0yKoXAEE5zc0ZpcI5G8/exec';

/* ---------- 공통 도우미 ---------- */
function el(html){ var d=document.createElement('div'); d.innerHTML=html.trim(); return d.firstElementChild; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function api(payload){
  return fetch(API, {
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify(payload),
    redirect:'follow'
  }).then(function(r){ return r.json(); });
}
function qs(name){
  var m = new RegExp('[?&]'+name+'=([^&]*)').exec(location.search);
  return m ? decodeURIComponent(m[1]) : '';
}
function todayStr(){
  var d=new Date(), p=function(n){return (n<10?'0':'')+n;};
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());
}
function normDate(v){
  var s = String(v||'').trim();
  var d = s.replace(/[^0-9]/g,'');
  if(d.length===8) return d.slice(0,4)+'-'+d.slice(4,6)+'-'+d.slice(6,8);
  return s;
}
function won(s){
  var n = String(s||'').replace(/[^0-9]/g,'');
  return n ? Number(n).toLocaleString('ko-KR')+'원' : (s||'');
}

/* ---------- 계약서 본문(양식 고정 문구) ---------- */
var CLAUSES = [
  ['제1조 [목적]','본 계약은 정부의 산모·신생아 건강관리 지원사업에 따라 제공기관과 제공인력 간의 권리·의무에 관한 사항을 명확히 규정함으로써 권리분쟁을 줄이고 해당 사업의 원활한 수행을 기함에 그 목적이 있다.'],
  ['제2조 [위탁업무]','"수임인"이 산후관리사로서 수행할 업무는 다음과 같다. ① 위탁받은 산모·신생아 건강관리 관련 제반 업무 ② 위탁받은 업무에 수반되는 신생아 케어 업무 ③ 기타 상호협의하에 위탁되는 산모도움, 일상생활지원 업무 등'],
  ['제3조 [계약기간]','① 이 계약의 계약기간은 위 계약기간과 같다. ② 계약기간 만료일까지 연장 합의가 없으면 본 계약은 자동 해지된 것으로 본다. ③ 위임인의 사업 폐지·양도 등으로 사업장이 소멸하면 본 계약도 자동 해지된다. ④ 위탁 계약 기간은 예약산모가 요청하는 기간에 따라 상이하며, 요청기간 종료와 함께 계약이 종료된다.'],
  ['제4조 [위탁업무수행장소]','"수임인"의 업무 장소는 ① 수급자의 주거지 ② 수급자에 대한 일상생활 지원을 위한 외출지역 ③ 수급자가 의료서비스를 받기 위해 동행하는 병원과 같다.'],
  ['제5조 [위탁업무 수행일 및 수행시간]','① 정부의 "산모·신생아 건강관리 지원사업 안내" 지침에 따라 업무 수행일은 1주 5일(월~금), 업무 수행시간은 1일 8시간 이내에서 수급자 상황에 따라 위임인과 수임인이 별도로 협의하여 정하는 시간으로 한다. ② 업무수행일 및 시간은 수급자의 서비스 이용기간이 변경됨에 따라 자동 변경되며, 일반적으로 월별 2주를 기준으로 한다.'],
  ['제6조 [위탁수수료]','① 위탁수수료는 보건복지부 산모·신생아 건강관리 지원사업 안내에 따라 기준(일반) 가격의 75% 이상 지급을 원칙으로 한다. ② 수수료 지급기준은 일급제(일급 109,800원 세전)이며, 바우처 이후 일반 예약산모는 일급 115,000원으로 한다.'],
  ['제7조 [위탁수수료 지급방법]','① 수임인의 업무수행에 따른 보수는 업무 수행 건당 발생하는 것으로 서비스 종료 후 2일 이내 지급한다. ② 보수지급 방법은 산모도움의 방법 및 횟수에 따라 변동 급여로 지급됨이 원칙이다.'],
  ['제8조 [건강보호 휴일 및 휴가]','연차유급휴가 : 없음'],
  ['제9조 [퇴직금 미지급]','수임인은 업무특성상 특수고용직에 해당되는 호출형 근무 형태로 근로관계가 성립되지 않으므로 퇴직금이 발생되지 않는다.'],
  ['제10조 [영업비밀 보호]','① 수임인은 위임사무 수행과정에서 알게 된 위임인의 업무상 비밀을 계약기간 중은 물론 계약 종료 후에도 누설하여서는 아니된다. ② 업무수행과정에서 알게 된 업무상 비밀을 취업 및 영리활동에 이용해서는 안된다. ③ 이를 위반하여 위임인이 손해를 입은 경우 배상해야 한다.'],
  ['제11조 [계약해지]','① 본 계약상의 의무를 이행하지 않거나 불완전 이행하여 계약 목적을 달성하기 어렵다고 판단되는 경우 ② 수임자에 대한 관계기관 또는 수급자로부터 민원이 접수되어 정상적인 업무수행이 어렵다고 판단되는 경우 ③ 수임자의 학력·경력 등 업무수행에 필요한 자격사항을 허위로 고지한 때 ④ 기타 사회통념상 계약의 유지가 어렵다고 판단될 때'],
  ['제12조 [계약기간종료]','수임자가 계약기간 도중 계약 관계를 일방적으로 종료하고자 할 때는 적어도 1개월까지는 위임인에게 서면으로 그 사실을 통보하여야 한다.'],
  ['제13조 [손해배상]','수임인이 본 계약 내용을 위반하거나 고의 또는 중과실로 손해를 발생시킨 경우 그 손해에 대해 배상할 책임이 있다.'],
  ['제14조 [기타사항]','본 계약은 정부의 산모·신생아 건강관리 지원사업에 따른 것으로 제공기관과 제공인력 간의 종속 노동성이 인정되지 않으므로 근로자성을 전제로 한 근로기준법 등 노동관계법령이 적용되지 않는 것에 동의한다. 또한 제공인력의 편의를 위해 사회보험 등에 가입할 수는 있지만 이것이 근로자성을 인정하는 징표가 결코 아님을 확인한다. 본 계약에서 정하지 아니한 사항은 당사자 간 합의하여 결정하며, 합의에 이르지 못할 경우 일반 상관례 및 민법에 따른다.']
];
var CONSENT_TEXT = '본 기관(특별자치시·도, 시·군·구, 보건복지부 및 사회보장정보원)은 「사회서비스 이용 및 이용권 권리에 관한 법률」, 「개인정보 보호법」 등에 의거하여 개인정보를 수집합니다. 수집 항목은 고유식별정보(주민등록번호·외국인등록번호)와 성명·생년월일·주소·연락처·이메일·예금계좌이며, 수집·이용 목적은 사회서비스 전자바우처 제도 관련 본인 확인, 제공인력 카드 제작·배송, 각종 안내문 발송, 만족도 조사, 정부 재정일자리 지원사업 현황 관리입니다. 보유 기간은 제공인력 퇴사 후 5년이며, 동의를 거부할 권리가 있고 거부에 따른 불이익은 없습니다(다만 제공인력 카드를 발급받을 수 없습니다).';
var OATH_TEXT = '본인은 귀사와 서비스 대상자의 등록 및 계약과 관련하여 업무상 취득한 대상자의 개인정보 및 귀사의 기밀사항을 누설하지 않을 것을 서약하며, 이를 누설하였을 시에는 동기여하를 막론하고 개인정보 보호 및 보안관계법규에 의거 처벌받음은 물론 어떠한 제재를 취하여도 이의를 제기하지 않을 것을 서약합니다.';

/* ============================================================
   화면 1 : 수신자(관리사) 계약서 확인·서명
   ============================================================ */
var app = document.getElementById('app');
var CT = null;        // 서버에서 받은 계약 정보
var CO = null;        // 회사 정보
var padCtx = null, padDirty = false;

function showRecipient(token){
  app.innerHTML = '<div class="notice">계약서를 불러오는 중입니다…</div>';
  api({action:'get', token:token}).then(function(r){
    if(!r.ok){
      var msg = r.error==='not_found'
        ? '유효하지 않거나 만료된 링크입니다.<br>가온누리산후도우미로 문의해 주세요.'
        : '계약서를 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.';
      app.innerHTML = '<div class="notice err">'+msg+'</div>';
      return;
    }
    CT = r.contract; CO = r.company;
    document.getElementById('topSub').textContent = CO.branch + '지사 · 관리사님 근로계약';
    document.title = '가온누리 전자계약 · ' + CO.branch + '지사';
    renderContract();
  }).catch(function(){
    app.innerHTML = '<div class="notice err">네트워크 오류로 불러오지 못했습니다. 인터넷 연결을 확인해 주세요.</div>';
  });
}

function renderContract(){
  if(CT.status === '완료'){ renderDone(); return; }

  var html = '';
  html += '<div class="card">'
       +   '<h2>업무위탁계약서 <span class="badge wait" style="float:right">서명 대기</span></h2>'
       +   '<div class="row"><span class="k">기관</span><span class="v">'+esc(CO.name)+' ('+esc(CO.branch)+'지사)</span></div>'
       +   '<div class="row"><span class="k">대표자</span><span class="v">'+esc(CO.ceo)+'</span></div>'
       +   '<div class="row"><span class="k">기관 주소</span><span class="v">'+esc(CO.addr)+'</span></div>'
       +   '<div class="row"><span class="k">계약기간</span><span class="v">'+esc(CT.start||'-')+' ~ '+esc(CT.end||'-')+'</span></div>'
       +   '<div class="row"><span class="k">수수료 기준</span><span class="v">일급 '+won(CT.rate)+' (세전)</span></div>'
       +   (CT.name ? '<div class="row"><span class="k">수임인</span><span class="v">'+esc(CT.name)+'</span></div>' : '')

function initPad(){
  var cv = document.getElementById('pad');
  var ratio = Math.min(window.devicePixelRatio || 1, 2);
  function size(){
    var w = cv.clientWidth, h = cv.clientHeight;
    cv.width = Math.round(w*ratio); cv.height = Math.round(h*ratio);
    padCtx = cv.getContext('2d');
    padCtx.scale(ratio, ratio);
    padCtx.lineWidth = 2.6; padCtx.lineCap='round'; padCtx.lineJoin='round'; padCtx.strokeStyle='#111';
  }
  size();
  var drawing = false, last = null;
  function pos(e){
    var r = cv.getBoundingClientRect();
    var t = e.touches ? e.touches[0] : e;
    return {x: t.clientX - r.left, y: t.clientY - r.top};
  }
  function down(e){
    e.preventDefault(); drawing = true; last = pos(e);
    document.getElementById('hint').style.display='none';
    padCtx.beginPath(); padCtx.arc(last.x, last.y, 1.1, 0, Math.PI*2); padCtx.fill();
  }
  function move(e){
    if(!drawing) return;
    e.preventDefault();
    var p = pos(e);
    padCtx.beginPath(); padCtx.moveTo(last.x, last.y); padCtx.lineTo(p.x, p.y); padCtx.stroke();
    last = p; padDirty = true;
  }
  function up(e){ drawing = false; }
  cv.addEventListener('mousedown', down); cv.addEventListener('mousemove', move);
  window.addEventListener('mouseup', up);
  cv.addEventListener('touchstart', down, {passive:false});
  cv.addEventListener('touchmove', move, {passive:false});
  cv.addEventListener('touchend', up);
  cv.addEventListener('touchcancel', up);
  document.getElementById('clearPad').addEventListener('click', function(){
    padCtx.clearRect(0,0,cv.width,cv.height);
    padDirty = false;
    document.getElementById('hint').style.display='block';
  });
}

function padEmpty(){
  var cv = document.getElementById('pad');
  var d = padCtx.getImageData(0,0,cv.width,cv.height).data;
  for(var i=3;i<d.length;i+=4){ if(d[i] !== 0) return false; }
  return true;
}

function doSubmit(){
  var msg = document.getElementById('msg');
  var name = document.getElementById('f_name').value.trim();
  var birth = document.getElementById('f_birth').value.trim();
  var phone = document.getElementById('f_phone').value.trim();
  var addr = document.getElementById('f_addr').value.trim();
  var a1 = document.getElementById('c1').checked;
  var a2 = document.getElementById('c2').checked;
  var a3 = document.getElementById('c3').checked;

  function fail(t){ msg.innerHTML = '<div class="notice err" style="margin:12px 0 0">'+t+'</div>'; msg.scrollIntoView({block:'center',behavior:'smooth'}); }
  if(!name) return fail('성명을 입력해 주세요.');
  if(!birth) return fail('생년월일을 입력해 주세요.');
  if(!phone) return fail('연락처를 입력해 주세요.');
  if(!addr) return fail('주소를 입력해 주세요.');
  if(!(a1&&a2)) return fail('개인정보 수집·이용 동의 2개 항목에 모두 체크해 주세요.');
  if(!a3) return fail('보안각서 확인에 체크해 주세요.');
  if(padEmpty()) return fail('손글씨 서명을 먼저 해 주세요.');

  var btn = document.getElementById('submitBtn');
  btn.disabled = true; btn.textContent = '제출하는 중…';
  msg.innerHTML = '';

  api({
    action:'submit', token:CT.token, name:name, birth:birth, phone:phone, address:addr,
    agree1:a1, agree2:a2, agree3:a3,
    sign: document.getElementById('pad').toDataURL('image/png'),

  }).then(function(r){
    if(r.ok){ CT.status='완료'; CT.done=r.doneAt; CT.name=name; renderDone(r); return; }
    btn.disabled = false; btn.textContent = '서명하고 제출하기';

    fail(m[r.error] || '제출에 실패했습니다. 잠시 후 다시 시도해 주세요.');
  }).catch(function(){
    btn.disabled = false; btn.textContent = '서명하고 제출하기';
    fail('네트워크 오류로 제출하지 못했습니다. 연결을 확인하고 다시 시도해 주세요.');
  });
}

    var m = el('<div class="modal"><div class="sheet">'
      + '<div style="display:flex;justify-content:space-between;align-items:center">'
      +   '<h2 style="margin:0;font-size:17px">'+esc(c.name||'(이름 없음)')+' <span class="badge '+(c.status==='완료'?'done':'wait')+'">'+esc(c.status)+'</span></h2>'
      +   '<button class="small gray" id="closeM" type="button">닫기</button></div>'
      + '<table class="mini" style="margin-top:12px">'
      +   '<tr><th>계약 유형</th><td>'+esc(c.type)+'</td></tr>'
      +   '<tr><th>지사</th><td>'+esc(c.branch)+'지사</td></tr>'
      +   '<tr><th>성명</th><td>'+esc(c.name||'-')+'</td></tr>'
      +   '<tr><th>생년월일</th><td>'+esc(c.birth||'-')+'</td></tr>'
      +   '<tr><th>연락처</th><td>'+esc(c.phone||'-')+'</td></tr>'
      +   '<tr><th>주소</th><td>'+esc(c.address||'-')+'</td></tr>'
      +   '<tr><th>계약기간</th><td>'+esc(c.start||'-')+' ~ '+esc(c.end||'-')+'</td></tr>'
      +   '<tr><th>일급</th><td>'+won(c.rate)+'</td></tr>'
      +   '<tr><th>요청 생성</th><td>'+esc(c.created||'-')+'</td></tr>'
      +   '<tr><th>서명 완료</th><td>'+esc(c.done||'-')+'</td></tr>'
      + '</table>'
      + (c.signData ? '<h3 style="font-size:14px;margin:16px 0 6px">손글씨 서명</h3><div style="border:1px solid #e5e7eb;border-radius:10px;padding:8px;background:#fff"><img src="'+c.signData+'" alt="서명" style="width:100%;max-width:340px;display:block;margin:0 auto"></div>' : '<p class="muted" style="margin-top:14px">아직 서명 전입니다.</p>')
      + (c.pdfUrl ? '<p class="muted" style="margin-top:12px">완료 문서: <a href="'+esc(c.pdfUrl)+'" target="_blank" rel="noopener">드라이브에서 보기</a></p>' : '')
      + '<p class="muted" style="margin-top:12px;font-size:12px">서명 링크: '+esc(location.origin+location.pathname+'?t='+c.token)+'</p>'
      + '</div></div>');
    document.body.appendChild(m);
    m.querySelector('#closeM').addEventListener('click', function(){ m.remove(); });
    m.addEventListener('click', function(e){ if(e.target===m) m.remove(); });
  });
}
