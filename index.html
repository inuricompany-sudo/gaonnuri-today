<!DOCTYPE html>
<html lang="ko">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>가온누리 오늘 현황</title>
  <style>
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;padding:0;width:100%;max-width:100%;overflow-x:hidden;background:#f4f6f3;color:#202124;
      font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
      -webkit-text-size-adjust:100%}
    header{padding:14px 14px 8px}
    h1{margin:0 0 6px;font-size:17px;letter-spacing:-.02em;color:#1f3d18}
    .sub{display:flex;align-items:center;gap:8px;font-size:12.5px;color:#5f6368}
    .count{margin-left:auto;font-weight:700;color:#2e6b2e;font-size:12.5px}
    .icobtn{flex:0 0 auto;border:1px solid #dde1dc;background:#fff;border-radius:9px;width:30px;height:30px;
      display:flex;align-items:center;justify-content:center;font-size:14px;color:#5f6368;padding:0}
    main{padding:0 0 10px}
    .row{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid #e8eae6;border-radius:12px;
      padding:9px 10px;margin:0 10px 7px;min-height:46px}
    .names{display:flex;align-items:center;gap:8px;flex:1 1 auto;min-width:0}
    .mother{flex:0 0 34%;text-align:right;font-size:13.5px;color:#202124;white-space:nowrap;overflow:hidden;
      text-overflow:ellipsis}
    .mother.end{color:#D93025;font-weight:700}
    .line{flex:1 1 auto;height:2px;background:#ccd1cb;border-radius:2px;min-width:6px}
    .care{flex:0 0 34%;text-align:left;font-size:13.5px;font-weight:600;color:#3c4043;white-space:nowrap;
      overflow:hidden;text-overflow:ellipsis;background:none;border:0;padding:0;font-family:inherit;cursor:pointer}
    .care.bad{color:#D93025;font-weight:700}
    .care .dot{display:inline-block;margin-left:2px;font-size:10px;color:#D93025;vertical-align:top}
    .sms{flex:0 0 26px;width:26px;height:26px;border-radius:8px;border:1px solid #e3e6e2;background:#fff;
      font-size:13px;display:flex;align-items:center;justify-content:center;padding:0;line-height:1}
    .sms.hide{visibility:hidden}
    .sms[disabled]{opacity:.28}
    .chk{position:relative;flex:0 0 26px;width:26px;height:26px;display:block}
    .chk input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;z-index:2}
    .chk .mark{display:flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:8px;
      border:1.5px solid #c8cec7;background:#fff;color:transparent;font-size:13px;font-weight:700}
    .chk input:checked + .mark{background:#2e7d32;border-color:#2e7d32;color:#fff}
    .chk input:disabled + .mark{opacity:.55}
    .row.twin{padding:7px 10px;align-items:stretch}
    .mcell{flex:0 0 34%;display:flex;flex-direction:column;align-items:flex-end;justify-content:center;gap:3px;min-width:0}
    .twinmark{font-size:10px;font-weight:700;color:#2e6b2e;background:#e8f3e6;border-radius:6px;padding:1px 5px;line-height:1.4}
    .tlist{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:5px}
    .tline{display:flex;align-items:center;gap:8px;min-width:0}
    .tline + .tline{border-top:1px dashed #ecefea;padding-top:5px}
    .tline .care{flex:1 1 auto;min-width:0}
    .empty{text-align:center;color:#8a8f8a;font-size:13px;padding:28px 16px}
    .msgbox{padding:2px 12px 24px}
    .mlbl{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;color:#70757a;margin:0 2px 5px}
    .mhint{color:#9aa09a}
    .msgbox textarea{width:100%;resize:none;border:1px solid #e1e5e0;border-radius:10px;padding:9px 10px;
      font-size:12.5px;font-family:inherit;color:#3c4043;background:#fff;line-height:1.45}
    .modal{position:fixed;inset:0;background:rgba(0,0,0,.42);display:none;align-items:flex-end;z-index:50}
    .modal.open{display:flex}
    .sheetbox{width:100%;max-width:100%;max-height:84vh;overflow-y:auto;background:#fff;border-radius:16px 16px 0 0;
      padding:16px 16px 22px}
    .sheetbox h2{margin:0 0 2px;font-size:16px}
    .sheetbox .meta{font-size:12px;color:#70757a;margin-bottom:12px}
    .docs{border-top:1px solid #eef0ed}
    .doc{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid #f1f3ef;font-size:13px}
    .doc .nm{flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .doc .dt{flex:0 0 auto;color:#8a8f8a;font-size:11.5px}
    .doc .st{flex:0 0 auto;font-size:11.5px;font-weight:700;padding:2px 7px;border-radius:8px;white-space:nowrap}
    .st.ok{background:#e8f3e6;color:#2e6b2e}
    .st.expired{background:#fdecea;color:#D93025}
    .st.missing{background:#f1f3f4;color:#5f6368}
    .st.soon{background:#fff4e5;color:#a05a00}
    .actions{display:flex;gap:8px;margin-top:16px}
    .btn{flex:1 1 0;text-align:center;text-decoration:none;padding:12px 10px;border-radius:11px;font-size:13.5px;
      font-weight:700;border:1px solid #dde1dc;color:#3c4043;background:#fff}
    .btn.primary{background:#2e7d32;border-color:#2e7d32;color:#fff}
    .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;background:rgba(32,33,36,.92);color:#fff;
      font-size:12.5px;padding:9px 14px;border-radius:10px;max-width:88%;text-align:center;display:none;z-index:80}

    /* ── 잠금 화면 ── */
    .app{display:none}
    .app.show{display:block}
    .lock{position:fixed;inset:0;z-index:100;background:#f4f6f3;display:flex;align-items:flex-start;justify-content:center;
      padding:22px 22px 28px;overflow-y:auto}
    .lock.hide{display:none}
    .lockbox{width:100%;max-width:290px;text-align:center;margin:auto}
    .lockicon{font-size:20px;line-height:1;color:#2e7d32}
    .locktitle{margin:8px 0 3px;font-size:17px;letter-spacing:-.02em;color:#1f3d18}
    .locksub{margin:0 0 16px;font-size:12.5px;color:#5f6368}
    .pindots{display:flex;justify-content:center;gap:14px;margin:2px 0 10px}
    .pd{width:13px;height:13px;border-radius:50%;border:1.5px solid #b9c0b7;background:#fff;transition:all .12s}
    .pd.on{background:#2e7d32;border-color:#2e7d32}
    .pinmsg{min-height:17px;font-size:12px;color:#5f6368;margin:0 0 10px}
    .pinmsg.err{color:#D93025;font-weight:600}
    .pad{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
    .pad button{height:50px;border-radius:12px;border:1px solid #e0e4df;background:#fff;font-size:20px;font-weight:600;
      color:#202124;font-family:inherit;padding:0}
    .pad button:active{background:#e9efe7}
    .pad button:disabled{opacity:.5}
    .pad .padfn{font-size:15px;color:#5f6368}
    .pad .padblank{border:0;background:transparent;pointer-events:none;visibility:hidden}
    .remember{display:flex;align-items:center;justify-content:center;gap:7px;margin-top:16px;font-size:12px;color:#5f6368}
    .remember input{width:16px;height:16px;accent-color:#2e7d32;margin:0}
    @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}
      60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
    .shake{animation:shake .32s}
  </style>
</head>
<body>

  <div class="lock" id="lock">
    <div class="lockbox">
      <div class="lockicon">🔒</div>
      <h1 class="locktitle">가온누리 오늘 현황</h1>
      <p class="locksub">비밀번호 4자리를 입력하세요</p>
      <div class="pindots" id="pindots">
        <span class="pd"></span><span class="pd"></span><span class="pd"></span><span class="pd"></span>
      </div>
      <div class="pinmsg" id="pinmsg"></div>
      <div class="pad" id="pad">
        <button type="button" data-k="1">1</button>
        <button type="button" data-k="2">2</button>
        <button type="button" data-k="3">3</button>
        <button type="button" data-k="4">4</button>
        <button type="button" data-k="5">5</button>
        <button type="button" data-k="6">6</button>
        <button type="button" data-k="7">7</button>
        <button type="button" data-k="8">8</button>
        <button type="button" data-k="9">9</button>
        <button type="button" class="padblank" tabindex="-1">·</button>
        <button type="button" data-k="0">0</button>
        <button type="button" class="padfn" data-k="del" title="지우기">⌫</button>
      </div>
      <label class="remember"><input type="checkbox" id="remember" checked><span>이 기기에서 기억하기</span></label>
    </div>
  </div>

  <div class="app" id="app">
    <header>
      <h1>가온누리 오늘 현황</h1>
      <div class="sub">
        <span id="dateLabel">…</span>
        <span class="count" id="count">카드체크 0/0</span>
        <button class="icobtn" id="lockBtn" title="잠그기">🔒</button>
        <button class="icobtn" id="reload" title="새로고침">↻</button>
      </div>
    </header>
    <main id="list"><div class="empty">불러오는 중…</div></main>

    <section class="msgbox">
      <div class="mlbl"><span>문자 안내 문구</span><span class="mhint">{관리사} · {산모} 로 이름 넣기</span></div>
      <textarea id="msg" rows="2" placeholder="안녕하세요 관리사님, 오늘 바우처 카드 체크 확인 부탁드립니다."></textarea>
    </section>
  </div>

  <div class="modal" id="modal">
    <div class="sheetbox" id="sheetbox"></div>
  </div>
  <div class="toast" id="toast"></div>

  <script>
    var GAS_URL = 'https://script.google.com/macros/s/AKfycbwtDjHQrU92nhzA6gKY8BVvmICHavxLiFJIz1Ca50oQMtzxGxZaV-uWTv6nyea4rBq3/exec';

    /* ── 서버 호출 (Apps Script doPost JSON API) ──
       Content-Type 헤더를 붙이지 않아 text/plain simple request 가 되고,
       CORS preflight(OPTIONS) 를 보내지 않습니다. */
    function callApi(payload) {
      var opt = { method: 'POST', body: JSON.stringify(payload), redirect: 'follow' };
      var ctl = null, tid = null;
      try { ctl = new AbortController(); opt.signal = ctl.signal; } catch (e) {}
      if (ctl) tid = setTimeout(function () { try { ctl.abort(); } catch (e) {} }, 30000);
      return fetch(GAS_URL, opt).then(function (res) {
        if (tid) clearTimeout(tid);
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.text();
      }).then(function (txt) {
        try { return JSON.parse(txt); } catch (e) { throw new Error('서버 응답을 읽지 못했습니다.'); }
      });
    }

    var DATA = { items: [], checked: 0, total: 0 };
    var DEFAULT_MSG = '안녕하세요 관리사님, 오늘 바우처 카드 체크 확인 부탁드립니다.';
    var MSG_KEY = 'gn_card_msg';
    var PIN_KEY = 'gn_pin_v1';

    /* ── 잠금 상태 ── */
    var PIN = '';        // 잠금이 풀린 뒤에만 값이 들어갑니다. (메모리에만 보관)
    var pinBuf = '';
    var PIN_BUSY = false;

    function store_(kind) {
      try {
        return kind === 'sess' ? window["sess" + "ion" + "Sto" + "rage"] : window["loc" + "al" + "Sto" + "rage"];
      } catch (e) { return null; }
    }
    function enc_(s) { try { return btoa(s); } catch (e) { return ''; } }
    function dec_(s) { try { return atob(s); } catch (e) { return ''; } }

    function readStoredPin() {
      var l = store_('loc'), s = store_('sess');
      try {
        var v = l && l.getItem(PIN_KEY);
        if (v) return dec_(v);
        v = s && s.getItem(PIN_KEY);
        if (v) return dec_(v);
      } catch (e) {}
      return '';
    }
    function writeStoredPin(pin, remember) {
      var l = store_('loc'), s = store_('sess');
      try {
        if (remember) {
          if (l) l.setItem(PIN_KEY, enc_(pin));
          if (s) s.removeItem(PIN_KEY);
        } else {
          if (s) s.setItem(PIN_KEY, enc_(pin));
          if (l) l.removeItem(PIN_KEY);
        }
      } catch (e) {}
    }
    function clearStoredPin() {
      var l = store_('loc'), s = store_('sess');
      try { if (l) l.removeItem(PIN_KEY); } catch (e) {}
      try { if (s) s.removeItem(PIN_KEY); } catch (e) {}
    }

    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }
    function toast(msg) {
      var t = document.getElementById('toast');
      t.textContent = msg;
      t.style.display = 'block';
      clearTimeout(t._h);
      t._h = setTimeout(function () { t.style.display = 'none'; }, 2600);
    }
    function updateCount() {
      var on = document.querySelectorAll('.chk input:checked').length;
      var all = document.querySelectorAll('.chk input').length;
      document.getElementById('count').textContent = '카드체크 ' + on + '/' + all;
    }

    /* ── 잠금 화면 ── */
    function paintDots() {
      var ds = document.querySelectorAll('#pindots .pd');
      for (var i = 0; i < ds.length; i++) {
        if (i < pinBuf.length) ds[i].classList.add('on'); else ds[i].classList.remove('on');
      }
    }
    function lockMsg(text, isErr) {
      var el = document.getElementById('pinmsg');
      el.textContent = text || '';
      if (isErr) el.classList.add('err'); else el.classList.remove('err');
    }
    function padEnabled(on) {
      var bs = document.querySelectorAll('#pad button[data-k]');
      for (var i = 0; i < bs.length; i++) bs[i].disabled = !on;
    }
    function showLock(msg) {
      PIN = '';
      pinBuf = '';
      paintDots();
      lockMsg(msg || '');
      padEnabled(true);
      PIN_BUSY = false;
      document.getElementById('app').classList.remove('show');
      document.getElementById('lock').classList.remove('hide');
    }
    function hideLock() {
      document.getElementById('lock').classList.add('hide');
      document.getElementById('app').classList.add('show');
    }

    /* 서버에서 PIN 검증 + 데이터 로드 */
    function unlock(pin, quiet) {
      if (PIN_BUSY) return;
      PIN_BUSY = true;
      padEnabled(false);
      if (!quiet) lockMsg('확인 중…');
      callApi({ action: 'load', pin: pin }).then(function (r) {
        PIN_BUSY = false;
        padEnabled(true);
        if (r && r.ok) {
          PIN = pin;
          if (!quiet) {
            var rem = document.getElementById('remember');
            writeStoredPin(pin, !!(rem && rem.checked));
          }
          hideLock();
          lockMsg('');
          render(r);
        } else {
          clearStoredPin();
          pinBuf = '';
          paintDots();
          lockMsg((r && r.message) || '비밀번호가 맞지 않습니다.', true);
          var box = document.querySelector('#lock .lockbox');
          if (box) {
            box.classList.remove('shake');
            void box.offsetWidth;
            box.classList.add('shake');
          }
        }
      }, function (e) {
        PIN_BUSY = false;
        padEnabled(true);
        lockMsg('연결하지 못했어요. 다시 시도해 주세요.', true);
      });
    }

    function lockNow(msg) {
      clearStoredPin();
      showLock(msg || '잠갔습니다. 비밀번호를 입력하세요.');
    }

    function pushDigit(d) {
      if (PIN_BUSY || PIN) return;
      if (pinBuf.length >= 4) return;
      pinBuf += d;
      paintDots();
      lockMsg('');
      if (pinBuf.length === 4) {
        var p = pinBuf;
        pinBuf = '';
        unlock(p);
      }
    }
    function delDigit() {
      if (PIN_BUSY || PIN) return;
      pinBuf = pinBuf.slice(0, -1);
      paintDots();
    }

    document.getElementById('pad').addEventListener('click', function (ev) {
      var b = ev.target.closest ? ev.target.closest('button[data-k]') : null;
      if (!b) return;
      var k = b.getAttribute('data-k');
      if (k === 'del') delDigit(); else pushDigit(k);
    });

    document.addEventListener('keydown', function (ev) {
      if (document.getElementById('lock').classList.contains('hide')) return;
      if (/^[0-9]$/.test(ev.key)) { ev.preventDefault(); pushDigit(ev.key); }
      else if (ev.key === 'Backspace') { ev.preventDefault(); delDigit(); }
    });

    /* ── 화면 그리기 ── */
    function rowHtml(it, idx) {
      var careClass = 'care' + (it.bad > 0 ? ' bad' : '');
      var badge = it.bad > 0 ? '<span class="dot">' + it.bad + '</span>' : '';
      var smsClass = 'sms' + (it.checked ? ' hide' : '');
      var smsDis = it.phone ? '' : ' disabled';
      var motherClass = 'mother' + (it.endToday ? ' end' : '');
      var motherTitle = it.endToday ? ' title="오늘 서비스 종료"' : '';
      return '<div class="row">' +
        '<div class="names">' +
          '<span class="' + motherClass + '"' + motherTitle + '>' + esc(it.mother) + '</span>' +
          '<span class="line"></span>' +
          '<button class="' + careClass + '" data-idx="' + idx + '">' + esc(it.caregiver) + badge + '</button>' +
        '</div>' +
        '<button class="' + smsClass + '" data-sms="' + idx + '" title="문자 보내기"' + smsDis + '>📩</button>' +
        '<label class="chk">' +
          '<input type="checkbox" data-idx="' + idx + '"' + (it.checked ? ' checked' : '') + '>' +
          '<span class="mark">✓</span>' +
        '</label>' +
      '</div>';
    }

    /* 쌍둥이: 산모 한 칸 안에 관리사 두 명을 위아래로 묶습니다. */
    function twinHtml(group, startIdx) {
      var lines = '';
      for (var g = 0; g < group.length; g++) {
        var it = group[g], idx = startIdx + g;
        var careClass = 'care' + (it.bad > 0 ? ' bad' : '');
        var badge = it.bad > 0 ? '<span class="dot">' + it.bad + '</span>' : '';
        var smsClass = 'sms' + (it.checked ? ' hide' : '');
        var smsDis = it.phone ? '' : ' disabled';
        lines += '<div class="tline">' +
          '<button class="' + careClass + '" data-idx="' + idx + '">' + esc(it.caregiver) + badge + '</button>' +
          '<button class="' + smsClass + '" data-sms="' + idx + '" title="문자 보내기"' + smsDis + '>📩</button>' +
          '<label class="chk">' +
            '<input type="checkbox" data-idx="' + idx + '"' + (it.checked ? ' checked' : '') + '>' +
            '<span class="mark">✓</span>' +
          '</label>' +
        '</div>';
      }
      var motherClass = 'mother' + (group[0].endToday ? ' end' : '');
      var motherTitle = group[0].endToday ? ' title="오늘 서비스 종료"' : '';
      return '<div class="row twin">' +
        '<div class="mcell">' +
          '<span class="' + motherClass + '"' + motherTitle + '>' + esc(group[0].mother) + '</span>' +
          '<span class="twinmark">쌍둥이</span>' +
        '</div>' +
        '<div class="tlist">' + lines + '</div>' +
      '</div>';
    }

    function render(data) {
      DATA = data;
      document.getElementById('dateLabel').textContent = data.dateLabel || '';
      var list = document.getElementById('list');
      if (!data.items || !data.items.length) {
        list.innerHTML = '<div class="empty">오늘 배정이 없습니다.</div>';
      } else {
        var html = '';
        var items = data.items;
        var i = 0;
        while (i < items.length) {
          var it = items[i];
          if (it.twin && it.groupSize > 1) {
            var group = [it];
            var j = i + 1;
            while (j < items.length && items[j].twin && items[j].groupSize > 1 && items[j].mother === it.mother) {
              group.push(items[j]);
              j++;
            }
            if (group.length > 1) {
              html += twinHtml(group, i);
              i = j;
              continue;
            }
          }
          html += rowHtml(it, i);
          i++;
        }
        list.innerHTML = html;
      }
      updateCount();
      if (!data.hasTodayColumn) toast(data.sheetName + '에 오늘 날짜 열이 없습니다.');
    }

    function load() {
      if (!PIN) return;
      document.getElementById('list').innerHTML = '<div class="empty">불러오는 중…</div>';
      callApi({ action: 'load', pin: PIN }).then(function (r) {
        if (!r || r.ok === false) { lockNow((r && r.message) || '다시 잠갔습니다.'); return; }
        render(r);
      }, function (e) {
        document.getElementById('list').innerHTML = '<div class="empty">불러오지 못했습니다.<br>' + esc(e.message || e) + '</div>';
      });
    }

    document.getElementById('reload').addEventListener('cl'+'ick', load);
    document.getElementById('lockBtn').addEventListener('cl'+'ick', function () { lockNow(); });
    document.getElementById('remember').addEventListener('change', function () {
      if (PIN) writeStoredPin(PIN, this.checked);
    });

    var msgEl = document.getElementById('msg');
    try {
      var saved = window["loc"+"al"+"Sto"+"rage"].getItem(MSG_KEY);
      msgEl.value = (saved === null || saved === '') ? DEFAULT_MSG : saved;
    } catch (e) { msgEl.value = DEFAULT_MSG; }
    msgEl.addEventListener('input', function () {
      try { window["loc"+"al"+"Sto"+"rage"].setItem(MSG_KEY, msgEl.value); } catch (e) {}
    });

    document.addEventListener('change', function (ev) {
      var cb = ev.target;
      if (!cb || cb.type !== 'checkbox' || cb.id === 'remember') return;
      var it = DATA.items[Number(cb.dataset.idx)];
      var want = cb.checked;
      cb.disabled = true;
      callApi({ action: 'setCard', pin: PIN, mother: it.mother, caregiver: it.caregiver, on: want }).then(function (r) {
        cb.disabled = false;
        if (!r || !r.ok) {
          cb.checked = !want;
          toast((r && r.message) || '저장하지 못했습니다.');
        } else {
          cb.checked = !!(r.value && r.value.length);
          it.checked = cb.checked;
          it.memo = r.value || '';
          var btn = document.querySelector('.sms[data-sms="' + cb.dataset.idx + '"]');
          if (btn) btn.classList.toggle('hide', it.checked);
        }
        updateCount();
      }, function (e) {
        cb.disabled = false;
        cb.checked = !want;
        updateCount();
        toast((e && e.message) || '저장하지 못했습니다.');
      });
    });

    function copyText(text) {
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(function () {
            toast('문구가 복사되었어요');
          }, function () { fallbackCopy(text); });
          return;
        }
      } catch (e) {}
      fallbackCopy(text);
    }
    function fallbackCopy(text) {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      ta.style.position = 'fixed';
      ta.style.left = '-9999px';
      document.body.appendChild(ta);
      ta.select();
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (e) {}
      document.body.removeChild(ta);
      toast(ok ? '문구가 복사되었어요' : '복사하지 못했어요');
    }

    function sendSms(idx) {
      var it = DATA.items[idx];
      if (!it) return;
      var num = String(it.phone || '').replace(/[^0-9]/g, '');
      if (!num) { toast('전화번호가 없어 문자를 열 수 없어요'); return; }
      var tpl = (msgEl.value || '').trim() || DEFAULT_MSG;
      var body = tpl.split('{관리사}').join(it.caregiver).split('{산모}').join(it.mother);
      copyText(body);
      var iOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
      var href = 'sm'+'s:' + num + (iOS ? '&body=' : '?body=') + encodeURIComponent(body);
      var a = document.createElement('a');
      a.href = href;
      a.target = '_top';
      a.rel = 'noopener';
      document.body.appendChild(a);
      a['cl'+'ick']();
      setTimeout(function () { a.remove(); }, 600);
    }

    document.addEventListener('click', function (ev) {
      var sms = ev.target.closest ? ev.target.closest('.sms') : null;
      if (sms) { sendSms(Number(sms.dataset.sms)); return; }
      var btn = ev.target.closest ? ev.target.closest('.care') : null;
      if (btn) { openDocs(Number(btn.dataset.idx)); return; }
      if (ev.target.id === 'modal' || ev.target.id === 'closeModal') closeModal();
    });

    function openDocs(idx) {
      var it = DATA.items[idx];
      if (!it) return;
      var bad = 0, rows = '';
      for (var i = 0; i < it.docs.length; i++) {
        var d = it.docs[i];
        if (d.counted && (d.status === 'expired' || d.status === 'missing')) bad++;
        rows += '<div class="doc">' +
          '<span class="nm">' + esc(d.label) + '</span>' +
          '<span class="dt">' + esc(d.date) + '</span>' +
          '<span class="st ' + d.status + '">' + esc(d.statusText) + '</span>' +
        '</div>';
      }
      if (!it.docs || !it.docs.length) rows = '<div class="doc"><span class="nm">시트에 서류 정보가 없습니다</span></div>';
      var head = bad > 0 ? '서류 부족·만료 ' + bad + '건' : '서류 정상';
      var drive = it.folder
        ? '<a class="btn primary" href="' + esc(it.folder) + '" target="_top">드라이브 서류 폴더 열기</a>'
        : '<span class="btn" style="color:#8a8f8a">폴더를 찾지 못했습니다</span>';
      document.getElementById('sheetbox').innerHTML =
        '<h2>' + esc(it.caregiver) + '</h2>' +
        '<div class="meta">' + esc(it.mother) + ' 산모 담당 · ' + esc(head) + '</div>' +
        '<div class="docs">' + rows + '</div>' +
        '<div class="actions">' + drive + '<button class="btn" id="closeModal">닫기</button></div>';
      document.getElementById('modal').classList.add('open');
    }
    function closeModal() {
      document.getElementById('modal').classList.remove('open');
    }

    if (location.search.indexOf('diag=1') >= 0) {
      setTimeout(function () {
        document.body.style.width = '390px';
        setTimeout(function () {
          var rows = document.querySelectorAll('.row');
          var maxOver = 0;
          for (var i = 0; i < rows.length; i++) {
            var o = rows[i].scrollWidth - rows[i].clientWidth;
            if (o > maxOver) maxOver = o;
          }
          var bodyOver = document.body.scrollWidth - document.body.clientWidth;
          var d = document.createElement('div');
          d.id = 'diag';
          d.style.cssText = 'font-size:11px;color:#D93025;padding:6px 12px;background:#fff';
          d.textContent = 'DIAG rows=' + rows.length + ' rowOverflow=' + maxOver + ' bodyOverflow=' + bodyOver +
            ' lock=' + (document.getElementById('lock').classList.contains('hide') ? 'off' : 'on');
          document.body.insertBefore(d, document.body.firstChild);
        }, 150);
      }, 150);
    }

    /* ── 시작: 기억해 둔 기기가 있으면 바로 서버 검증, 없으면 잠금 화면 ── */
    (function boot() {
      paintDots();
      var saved = readStoredPin();
      if (saved) {
        lockMsg('확인 중…');
        unlock(saved, true);
      } else {
        showLock('');
      }
    })();
  </script>
</body>
</html>
