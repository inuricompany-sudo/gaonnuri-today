<body>

  <div class="lock" id="lock">
    <div class="lockbox">
      <div class="lockicon">🔒</div>
      <h1 class="locktitle">가온누리 오늘 현황</h1>
      <p class="locksub">비밀번호 4자리를 입력하세요</p>
      <div class="pindots" id="pindots">
        <span class="pd"></span><span class="pd"></span><span class="pd"></span><span class="pd"></span>
      </div>
      <div class="pinmsg" id="pinmsg"></div>
      <div class="pad" id="pad">
        <button type="button" data-k="1">1</button>
        <button type="button" data-k="2">2</button>
        <button type="button" data-k="3">3</button>
        <button type="button" data-k="4">4</button>
        <button type="button" data-k="5">5</button>
        <button type="button" data-k="6">6</button>
        <button type="button" data-k="7">7</button>
        <button type="button" data-k="8">8</button>
        <button type="button" data-k="9">9</button>
        <button type="button" class="padblank" tabindex="-1">·</button>
        <button type="button" data-k="0">0</button>
        <button type="button" class="padfn" data-k="del" title="지우기">⌫</button>
      </div>
      <label class="remember"><input type="checkbox" id="remember" checked><span>이 기기에서 기억하기</span></label>
    </div>
  </div>

  <div class="app" id="app">
    <header>
      <h1>가온누리 오늘 현황</h1>
      <div class="sub">
        <span id="dateLabel">…</span>
        <span class="rolebadge viewer" id="roleBadge" title="보기 전용 — 조회만 할 수 있어요">보기전용</span>
        <span class="count" id="count">카드체크 0/0</span>
        <button class="icobtn" id="lockBtn" title="잠그기">🔒</button>
        <button class="icobtn" id="reload" title="새로고침">↻</button>
      </div>
    </header>
    <div class="daynav" id="daynav"></div>
    <main id="list"><div class="empty">불러오는 중…</div></main>

    <section class="msgbox">
      <div class="mlbl"><span>문자 안내 문구</span><span class="mhint">{관리사} · {산모} 로 이름 넣기</span></div>
      <textarea id="msg" rows="2" placeholder="안녕하세요 관리사님, 오늘 바우처 카드 체크 확인 부탁드립니다."></textarea>
    </section>
  </div>

  <div class="modal" id="modal">
    <div class="sheetbox" id="sheetbox"></div>
  </div>
  <div class="toast" id="toast"></div>

  <script>
    var GAS_URL = 'https://script.google.com/macros/s/AKfycbwtDjHQrU92nhzA6gKY8BVvmICHavxLiFJIz1Ca50oQMtzxGxZaV-uWTv6nyea4rBq3/exec';

    /* ── 서버 호출 (Apps Script doPost JSON API) ──
       Content-Type 헤더를 붙이지 않아 text/plain simple request 가 되고,
       CORS preflight(OPTIONS) 를 보내지 않습니다. */
    function callApi(payload) {
      // v15: 브라우저·중간 캐시에 옛 응답이 남지 않게 no-store
      var opt = { method: 'POST', body: JSON.stringify(payload), redirect: 'follow', cache: 'no-store' };
      var ctl = null, tid = null;
      try { ctl = new AbortController(); opt.signal = ctl.signal; } catch (e) {}
      if (ctl) tid = setTimeout(function () { try { ctl.abort(); } catch (e) {} }, 30000);
      var t0 = nowMs_();
      return fetch(GAS_URL, opt).then(function (res) {
        if (tid) clearTimeout(tid);
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.text();
      }).then(function (txt) {
        try { var out = JSON.parse(txt); PERF.apiMs = Math.round(nowMs_() - t0); return out; }
        catch (e) { throw new Error('서버 응답을 읽지 못했습니다.'); }
      });
    }

    var DATA = { items: [], checked: 0, total: 0 };
    /* v23: 지금 보고 있는 날짜 (서버가 준 view). isToday 일 때만 카드체크·자동 동기화 */
    var VIEW = { date: '', isToday: true, isPast: false, isFuture: false, offset: 0, short: '' };

    /* v36.1 (위젯 v1.5): 바탕화면 위젯에서 ?tab=ended|today|upcoming 으로 열면 그 탭부터 보여 줍니다.
       잠금 화면을 거치므로 데이터를 받은 뒤(unlock/load) 한 번만 씁니다. */
    var START_TAB = (function () {
      try {
        var m = /[?&]tab=(ended|today|upcoming)/.exec(location.search);
        return m ? m[1] : '';
      } catch (e) { return ''; }
    })();
    /* v28: 보고 있는 날짜가 주말(토·일)인지 — 주말은 기본 휴무 문구를 씁니다. */
    var IS_WEEKEND = false;
    /* v15: 실시간 반영 상태
       · SYNCING   — 백그라운드 동기화 진행 중
       · PENDING   — 저장 요청 진행 중 건수 (그동안 자동 동기화는 쉼)
       · LAST_LOAD — 마지막으로 서버 데이터를 받은 시각
       · MODAL     — 열려 있는 패널 { kind:'docs'|'mother', key:이름 }
       · SYNC_GAP  — 화면 복귀 시 이 시간(ms)이 지났으면 다시 읽습니다. */
    var SYNCING = false, PENDING = 0, LAST_LOAD = 0, MODAL = null, SYNC_GAP = 4000;
    /* v17: 모달의 '지난 날짜 소급 추가' 입력값 (다시 그려도 유지) */
    var RETRO = { mother: '', date: '', helper: '' };
    /* v17: '삭제?' 확인 대기 상태 — 다시 그려도 유지되도록 화면이 아니라 여기에 둡니다.
       key = '날짜|관리사', until = 이 시각(ms)까지 한 번 더 누르면 지웁니다. */
    var DEL_ARM = { key: '', until: 0 };
    function delArmed_(key) { return DEL_ARM.key === key && Date.now() < DEL_ARM.until; }
    var DEFAULT_MSG = '안녕하세요 관리사님, 오늘 바우처 카드 체크 확인 부탁드립니다.';
    var MSG_KEY = 'gn_card_msg';
    var PIN_KEY = 'gn_pin_v1';
    /* v30: 이 기기에서만 쓰는 '직전 세 탭' 캐시 (공개 파일에는 데이터 없음) */
    var CACHE_KEY = 'gn_all_v3';             // v34: 카드체크 X/Y·바우처가 들어간 새 응답만 그립니다
    var CACHE_KEY_OLD = 'gn_all_v2';          // v30~v33 캐시 — 지울 때 함께 정리
    /* v30: 종료 · 오늘 · 예정 세 화면을 메모리에 두고 탭 전환은 서버 호출 없이 그립니다. */
    var ALL = { ended: null, today: null, upcoming: null };
    var INDEX = {};                            // 날짜('YYYY-MM-DD') → 그 날 화면 데이터
    /* v19: 체감 확인용 계측값 (화면에는 표시하지 않음) */
    var PERF = { cachePaint: -1, netPaint: -1, apiMs: -1 };
    try { window.__perf = PERF; } catch (e) {}
    function nowMs_() { try { return (window.performance && performance.now) ? performance.now() : Date.now(); } catch (e) { return Date.now(); } }
    var BOOT_T0 = nowMs_();

    /* ── 잠금 상태 ── */
    var PIN = '';        // 잠금이 풀린 뒤에만 값이 들어갑니다. (메모리에만 보관)
    var pinBuf = '';
    var PIN_BUSY = false;

    function store_(kind) {
      try {
        return kind === 'sess' ? window["sess" + "ion" + "Sto" + "rage"] : window["loc" + "al" + "Sto" + "rage"];
      } catch (e) { return null; }
    }
    function enc_(s) { try { return btoa(s); } catch (e) { return ''; } }
    function dec_(s) { try { return atob(s); } catch (e) { return ''; } }

    function readStoredPin() {
      var l = store_('loc'), s = store_('sess');
      try {
        var v = l && l.getItem(PIN_KEY);
        if (v) return dec_(v);
        v = s && s.getItem(PIN_KEY);
        if (v) return dec_(v);
      } catch (e) {}
      return '';
    }
    function writeStoredPin(pin, remember) {
      var l = store_('loc'), s = store_('sess');
      try {
        if (remember) {
          if (l) l.setItem(PIN_KEY, enc_(pin));
          if (s) s.removeItem(PIN_KEY);
        } else {
          if (s) s.setItem(PIN_KEY, enc_(pin));
          if (l) l.removeItem(PIN_KEY);
        }
      } catch (e) {}
    }
    function clearStoredPin() {
      var l = store_('loc'), s = store_('sess');
      try { if (l) l.removeItem(PIN_KEY); } catch (e) {}
      try { if (s) s.removeItem(PIN_KEY); } catch (e) {}
    }

    /* v19: 마지막으로 받은 화면 상태를 이 기기에만 저장합니다.
       '이 기기에서 기억하기'면 localStorage, 아니면 sessionStorage.
       잠그기·PIN 실패 때는 지워서 다음에 PIN을 다시 받습니다. */

    /* v30: 세 탭 데이터를 한 덩어리로 이 기기에만 저장합니다.
       '이 기기에서 기억하기'면 localStorage, 아니면 sessionStorage — 예전과 같습니다.
       잠그기·PIN 실패 때는 지워서 다음에 PIN을 다시 받습니다. */
    function saveCache() {
      try {
        if (!ALL.today) return;
        var payload = JSON.stringify({
          t: Date.now(), last: viewKey_(),
          all: { ended: ALL.ended, today: ALL.today, upcoming: ALL.upcoming }
        });
        var l = store_('loc'), s = store_('sess');
        var remember = false;
        try { remember = !!(l && l.getItem(PIN_KEY)); } catch (e0) {}
        if (!remember && !!PIN) { var rem = document.getElementById('remember'); remember = rem ? !!rem.checked : false; }
        if (remember) {
          if (l) l.setItem(CACHE_KEY, payload);
          if (s) s.removeItem(CACHE_KEY);
        } else {
          if (s) s.setItem(CACHE_KEY, payload);
          if (l) l.removeItem(CACHE_KEY);
        }
      } catch (e) {}
    }
    function readCache() {
      try {
        var l = store_('loc'), s = store_('sess');
        var raw = (l && l.getItem(CACHE_KEY)) || (s && s.getItem(CACHE_KEY));
        if (!raw) return null;
        var o = JSON.parse(raw);
        if (!o || !o.all || !o.all.today) return null;
        return { last: o.last || 'today', all: o.all };
      } catch (e) { return null; }
    }
    function clearCache() {
      try { var l = store_('loc'); if (l) { l.removeItem(CACHE_KEY); l.removeItem(CACHE_KEY_OLD); } } catch (e) {}
      try { var s = store_('sess'); if (s) { s.removeItem(CACHE_KEY); s.removeItem(CACHE_KEY_OLD); } } catch (e) {}
    }

    /* ── v30: 세 탭 데이터 담기 / 꺼내기 ─────────────────────────────
       서버(loadAll)는 오늘 응답에 days:{ended, upcoming} 를 붙여 보냅니다.
       세 화면을 ALL 에 나눠 담고, 날짜로 바로 찾을 수 있게 INDEX 를 만듭니다. */
    function setAll(today, ended, up) {
      if (!today) return false;
      ALL.today = today;
      ALL.ended = ended || null;
      ALL.upcoming = up || null;
      INDEX = {};
      var arr = [ALL.ended, ALL.today, ALL.upcoming], i;
      for (i = 0; i < arr.length; i++) {
        var p = arr[i];
        if (!p) continue;
        if (today.role) p.role = today.role;             // 탭마다 권한 표시를 같게
        if (p.view && p.view.date) INDEX[p.view.date] = p;
      }
      return true;
    }
    function applyResponse(r) {
      if (!r || r.ok === false || !r.days) return false;
      return setAll(r, r.days.ended, r.days.upcoming);
    }
    function callAll(pin) { return callApi({ action: 'loadAll', pin: pin }); }
    function payloadOf(key) { return ALL[key] || null; }
    function findPayload(date) { return (date && INDEX[date]) || null; }
    function viewKey_() {
      if (!VIEW) return 'today';
      return VIEW.isPast ? 'ended' : (VIEW.isFuture ? 'upcoming' : 'today');
    }
    /* 지금 보고 있는 탭을 최신 데이터로 다시 그립니다. */
    function renderPayload(key) {
      var p = payloadOf(key) || ALL.today || null;
      if (p) render(p);
      return p;
    }

    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }
    function toast(msg) {
      var t = document.getElementById('toast');
      t.textContent = msg;
      t.style.display = 'block';
      clearTimeout(t._h);
      t._h = setTimeout(function () { t.style.display = 'none'; }, 2600);
    }
    /* ── v20: 권한 (보기 전용 / 관리자) ──────────────────────────────
       서버가 load 응답의 role('admin' | 'viewer')로 알려 줍니다.
       · 값이 없거나 모르는 값(구버전 캐시 포함)이면 '보기 전용'으로 봅니다. (안전한 쪽)
       · 화면은 체크박스를 잠그고 소급 추가·삭제 버튼을 숨깁니다.
         실제 차단은 서버가 관리자 PIN 인지 다시 확인해 처리합니다. */
    var ROLE = 'viewer';
    function isAdmin_() { return ROLE === 'admin'; }
    function setRole_(role) {
      ROLE = (role === 'admin') ? 'admin' : 'viewer';
      var b = document.getElementById('roleBadge');
      if (!b) return;
      b.textContent = ROLE === 'admin' ? '관리자' : '보기전용';
      b.className = 'rolebadge ' + ROLE;
      b.title = ROLE === 'admin' ? '관리자 권한 — 카드체크·소급 기록을 바꿀 수 있어요'
        : '보기 전용 — 조회만 할 수 있어요';
    }
    var VIEWER_MSG = '보기 전용이에요. 관리자 비밀번호로 로그인해 주세요.';

    /* v27: '일반' 산모는 바우처 카드체크 대상이 아니므로 총합(total)·완료 수(checked)
       어디에도 세지 않습니다. (목록에는 그대로 나오고 ☑ 모양도 그대로 보입니다) */
    function updateCount() {
      var boxes = document.querySelectorAll('.chk input:not([data-normal])');
      var all = boxes.length, on = 0;
      for (var i = 0; i < boxes.length; i++) if (boxes[i].checked) on++;
      // v28: 주말에 근무표 기록이 없으면 카드체크 0/0 대신 '주말 휴무'로 보여 줍니다.
      document.getElementById('count').textContent = (IS_WEEKEND && !all) ? '주말 휴무' : '카드체크 ' + on + '/' + all;
    }

    /* ── 잠금 화면 ── */
    function paintDots() {
      var ds = document.querySelectorAll('#pindots .pd');
      for (var i = 0; i < ds.length; i++) {
        if (i < pinBuf.length) ds[i].classList.add('on'); else ds[i].classList.remove('on');
      }
    }
    function lockMsg(text, isErr) {
      var el = document.getElementById('pinmsg');
      el.textContent = text || '';
      if (isErr) el.classList.add('err'); else el.classList.remove('err');
    }
    function padEnabled(on) {
      var bs = document.querySelectorAll('#pad button[data-k]');
      for (var i = 0; i < bs.length; i++) bs[i].disabled = !on;
    }
    function showLock(msg) {
      PIN = '';
      pinBuf = '';
      paintDots();
      lockMsg(msg || '');
      padEnabled(true);
      PIN_BUSY = false;
      document.getElementById('app').classList.remove('show');
      document.getElementById('lock').classList.remove('hide');
    }
    function hideLock() {
      document.getElementById('lock').classList.add('hide');
      document.getElementById('app').classList.add('show');
    }

    /* 서버에서 PIN 검증 + 데이터 로드 */
    function unlock(pin, quiet) {
      if (PIN_BUSY) return;
      PIN_BUSY = true;
      padEnabled(false);
      if (!quiet) lockMsg('확인 중…');
      callAll(pin).then(function (r) {
        PIN_BUSY = false;
        padEnabled(true);
        if (r && r.ok) {
          PIN = pin;
          if (!quiet) {
            var rem = document.getElementById('remember');
            writeStoredPin(pin, !!(rem && rem.checked));
          }
          hideLock();
          lockMsg('');
          applyResponse(r);              // v30: 세 탭을 한 번에 받아 메모리에
          // v36.1: 위젯에서 지정한 탭(종료/예정)이 있으면 그 탭부터, 없으면 보던 탭 그대로
          var k0 = (START_TAB && payloadOf(START_TAB)) ? START_TAB : viewKey_();
          START_TAB = '';
          renderPayload(k0);
          PERF.netPaint = Math.round(nowMs_() - BOOT_T0);
          loadStats(false);          // v19: 일수·날짜 내역은 뒤에서
        } else {
          clearStoredPin();
          clearCache();              // v19: 실패하면 캐시도 지웁니다.
          pinBuf = '';
          paintDots();
          lockMsg((r && r.message) || '비밀번호가 맞지 않습니다.', true);
          var box = document.querySelector('#lock .lockbox');
          if (box) {
            box.classList.remove('shake');
            void box.offsetWidth;
            box.classList.add('shake');
          }
        }
      }, function (e) {
        PIN_BUSY = false;
        padEnabled(true);
        lockMsg('연결하지 못했어요. 다시 시도해 주세요.', true);
      });
    }

    function lockNow(msg) {
      MODAL = null;
      clearStoredPin();
      clearCache();               // v19: 잠그면 이 기기의 화면 캐시도 비웁니다.
      showLock(msg || '잠갔습니다. 비밀번호를 입력하세요.');
    }

    function pushDigit(d) {
      if (PIN_BUSY || PIN) return;
      if (pinBuf.length >= 4) return;
      pinBuf += d;
      paintDots();
      lockMsg('');
      if (pinBuf.length === 4) {
        var p = pinBuf;
        pinBuf = '';
        unlock(p);
      }
    }
    function delDigit() {
      if (PIN_BUSY || PIN) return;
      pinBuf = pinBuf.slice(0, -1);
      paintDots();
    }

    document.getElementById('pad').addEventListener('click', function (ev) {
      var b = ev.target.closest ? ev.target.closest('button[data-k]') : null;
      if (!b) return;
      var k = b.getAttribute('data-k');
      if (k === 'del') delDigit(); else pushDigit(k);
    });

    document.addEventListener('keydown', function (ev) {
      if (document.getElementById('lock').classList.contains('hide')) return;
      if (/^[0-9]$/.test(ev.key)) { ev.preventDefault(); pushDigit(ev.key); }
      else if (ev.key === 'Backspace') { ev.preventDefault(); delDigit(); }
    });

    /* ── 화면 그리기 ── */
    /* v20: 체크박스 한 칸 — 보기 전용이면 같은 ☑/☐ 모양 그대로, 누를 수만 없게(disabled). */
    function chkHtml(it, idx) {
      var fixed = !!it.isNormal;
      var ro = !isAdmin_();
      var title = ro ? ' title="보기 전용 — 관리자만 바꿀 수 있어요"'
        : (fixed ? ' title="일반 산모 · 카드체크 대상 아님"' : '');
      return '<label class="chk' + (fixed ? ' fixed' : '') + (ro ? ' ro' : '') + '"' + title + '>' +
        '<input type="checkbox" data-idx="' + idx + '"' + (fixed ? ' data-normal="1"' : '') +
          (it.checked ? ' checked' : '') + (ro ? ' disabled' : '') + '>' +
        '<span class="mark">✓</span>' +
      '</label>';
    }
    /* ── v35: '(카드만)' 표기 관리사 ─────────────────────────────────
       [배정정보] 관리사1·2 에 '곽서영(카드만)' 처럼 적힌 건은 실제로 근무하는 관리사가
       아니라 바우처 카드 명의자만 적어 둔 것입니다. 앱에서는 그 이름을 연한 색으로 그려
       실제 근무자와 눈으로 구분합니다. (이름·괄호 글자는 그대로 둡니다 — 서버로 보내는
       값도 바꾸지 않습니다. 카드체크·소급 기록은 이 이름 그대로 저장됩니다.) */
    var CARDONLY_RE = /카드\s*만/;
    function isCardName_(name) { return CARDONLY_RE.test(String(name == null ? '' : name)); }
    /* '(카드만)' 꼬리를 뗀 순수 이름 — 배정정보와 근무표의 이름을 맞출 때 씁니다. */
    function bareName_(name) {
      var s = String(name == null ? '' : name).trim();
      if (!isCardName_(s)) return s;
      s = s.replace(/\(\s*카드\s*만\s*\)/g, ' ').replace(/카드\s*만/g, ' ');
      return s.replace(/[\s,·\/]+$/g, '').replace(/\s+/g, ' ').trim();
    }
    /* 이 산모의 [배정정보] 가 '(카드만)' 으로 적어 둔 관리사 이름들 (괄호 뗀 이름) */
    function cardOnlyNames_(mother) {
      var out = [], as = (DATA.motherAssign || {})[mother], arr, i, v;
      if (!as) return out;
      arr = [as.care1, as.care2];
      for (i = 0; i < arr.length; i++) {
        v = String(arr[i] == null ? '' : arr[i]).trim();
        if (!v || !isCardName_(v)) continue;
        v = bareName_(v);
        if (v && out.indexOf(v) < 0) out.push(v);
      }
      return out;
    }
    /* 화면에 그릴 이 관리사 이름이 '카드만' 표기인지
       — 글자에 (카드만)이 있거나, 이 산모의 [배정정보]가 이 사람을 카드 명의자로 적어 둔 경우 */
    function cardOnly_(mother, name) {
      var s = String(name == null ? '' : name);
      if (isCardName_(s)) return true;
      var b = bareName_(s);
      return !!b && cardOnlyNames_(mother).indexOf(b) >= 0;
    }
    /* 클래스 문자열에 필요하면 ' cardonly' 를 붙입니다. */
    function careCls_(base, mother, name) { return base + (cardOnly_(mother, name) ? ' cardonly' : ''); }
    /* 이름 하나를 그대로 그리는 HTML (괄호·글자 그대로, 색만 카드만이면 연하게) */
    function nameHtml_(mother, name) {
      return '<span' + (cardOnly_(mother, name) ? ' class="cardonly"' : '') + '>' + esc(name) + '</span>';
    }
    function rowHtml(it, idx) {
      var careClass = careCls_('care' + (it.bad > 0 ? ' bad' : ''), it.mother, it.caregiver);
      var badge = it.bad > 0 ? '<span class="dot">' + it.bad + '</span>' : '';
      var fixed = !!it.isNormal;                       // v16: 일반 산모
      var smsClass = 'sms' + (it.checked || fixed ? ' hide' : '');
      var smsDis = it.phone ? ' title="문자 보내기"' : ' title="전화번호가 없어 문자를 열 수 없어요"';
      var motherClass = 'mother tap' + (it.endToday ? ' end' : '');
      var motherTitle = fixed ? ' title="일반 신청 산모 · 눌러서 자세히"'
        : (it.endToday ? ' title="오늘 서비스 종료 · 눌러서 카드체크 내역"' : ' title="눌러서 카드체크 내역"');
      return '<div class="row">' +
        '<div class="names">' +
          '<span class="' + motherClass + '" data-mom="' + idx + '"' + motherTitle + '>' + esc(it.mother) + '</span>' +
          '<span class="line"></span>' +
          '<button class="' + careClass + '" data-idx="' + idx + '">' + esc(it.caregiver) + badge + '</button>' +
        '</div>' +
        '<button class="' + smsClass + '" data-sms="' + idx + '"' + smsDis + '>📩</button>' +
        chkHtml(it, idx) +
      '</div>';
    }

    /* 쌍둥이: 산모 한 칸 안에 관리사 두 명을 위아래로 묶습니다. */
    function twinHtml(group, startIdx) {
      var lines = '';
      for (var g = 0; g < group.length; g++) {
        var it = group[g], idx = startIdx + g;
        var careClass = careCls_('care' + (it.bad > 0 ? ' bad' : ''), it.mother, it.caregiver);
        var badge = it.bad > 0 ? '<span class="dot">' + it.bad + '</span>' : '';
        var fixed = !!it.isNormal;                       // v16: 일반 산모
        var smsClass = 'sms' + (it.checked || fixed ? ' hide' : '');
        var smsDis = it.phone ? ' title="문자 보내기"' : ' title="전화번호가 없어 문자를 열 수 없어요"';
        lines += '<div class="tline">' +
          '<button class="' + careClass + '" data-idx="' + idx + '">' + esc(it.caregiver) + badge + '</button>' +
          '<button class="' + smsClass + '" data-sms="' + idx + '"' + smsDis + '>📩</button>' +
          chkHtml(it, idx) +
        '</div>';
      }
      var gfixed = !!group[0].isNormal;
      var motherClass = 'mother tap' + (group[0].endToday ? ' end' : '');
      var motherTitle = gfixed ? ' title="일반 신청 산모 · 눌러서 자세히"'
        : (group[0].endToday ? ' title="오늘 서비스 종료 · 눌러서 카드체크 내역"' : ' title="눌러서 카드체크 내역"');
      return '<div class="row twin">' +
        '<div class="mcell">' +
          '<span class="' + motherClass + '" data-mom="' + startIdx + '"' + motherTitle + '>' + esc(group[0].mother) + '</span>' +
          '<span class="twinmark">쌍둥이</span>' +
        '</div>' +
        '<span class="line"></span>' +
        '<div class="tlist">' + lines + '</div>' +
      '</div>';
    }

    /* v18: 내일 시작 산모 카드 — 오늘 목록과 섞이지 않도록
       체크박스도 📩 버튼도 없이 '산모 ↔ 관리사(1~2명)' 만 보여 줍니다. */
    function tomorrowHtml(it, badge) {
      var cares = (it.caregivers && it.caregivers.length) ? it.caregivers : (it.caregiver ? [it.caregiver] : []);
      var names = '', i;
      for (i = 0; i < cares.length; i++) names += '<span class="tn' + (cardOnly_(it.mother, cares[i]) ? ' cardonly' : '') + '">' + esc(cares[i]) + '</span>';
      if (!names) names = '<span class="tnone">관리사 미정</span>';
      var note = it.noteShort ? '<div class="ntnote">' + esc(it.noteShort) + '</div>' : '';
      return '<div class="row next" title="' + esc(it.start || '') + ' 시작 · 오늘 목록 아님">' +
        '<div class="mnext">' +
          '<span class="mother">' + esc(it.mother) + '</span>' +
          '<span class="nextbadge">' + esc(badge || '내일 시작') + '</span>' +
        '</div>' +
        '<span class="line"></span>' +
        '<div class="tnames">' + names + '</div>' +
        note +
      '</div>';
    }

    /* v36: 이 구역의 제목 — 서버가 준 기준일(tomorrowDate)이 월요일이면
       주말(토·일) 휴무를 건너뛴 것이라 '내일 시작' 대신 '월요일 시작'으로 적습니다.
       (금요일 화면이 대표적 · 서버가 오늘+3일을 내려줍니다) */
    function tomorrowLabel_(data) {
      var s = (data && data.tomorrowDate) || '';
      var m = s.match(/^(\d{4})-(\d{2})-(\d{2})$/);
      if (!m) return '내일 시작';
      var w = new Date(Date.UTC(Number(m[1]), Number(m[2]) - 1, Number(m[3]))).getUTCDay();
      return w === 1 ? '월요일 시작' : '내일 시작';
    }

    /* 내일 시작하는 산모가 있을 때만, 오늘 목록 아래에 구분선과 함께 붙입니다. */
    function tomorrowSection(data) {
      var ts = data.tomorrowStarts || [];
      var lbl = tomorrowLabel_(data);
      if (!ts.length) {
        // v24: 내일 시작이 없어도 '없음'을 한 줄로 분명히 보여 줍니다 (오늘 화면에서 가장 먼저 확인할 것)
        return '<section class="tsec"><div class="thead">' +
          '<span class="ttl">📌 ' + lbl + '</span>' +
          '<span class="tsub">' + lbl + '하는 산모 없음</span>' +
        '</div></section>';
      }
      var html = '<section class="tsec">' +
        '<div class="thead">' +
          '<span class="ttl">📌 ' + lbl + '</span>' +
          '<span class="tsub">오늘 아님 · 참고용</span>' +
        '</div>';
      for (var i = 0; i < ts.length; i++) html += tomorrowHtml(ts[i], lbl);
      return html + '</section>';
    }

    function render(data) {
      // v20: 서버가 알려 준 권한으로 화면 모드를 먼저 정합니다. (모르는 값·구버전 캐시 = 보기 전용)
      setRole_(data && data.role);
      // v19: 가벼운 load 응답에는 일수 집계가 없습니다. 직전에 받아 둔 집계는 유지합니다.
      if ((!data.motherStats || !Object.keys(data.motherStats).length) && DATA.motherStats) data.motherStats = DATA.motherStats;
      DATA = data;
      LAST_LOAD = Date.now();
      VIEW = data.view || { date: '', isToday: true, isPast: false, isFuture: false, offset: 0, short: '' };
      // v28: 서버가 준 날짜 라벨의 요일로 주말을 판정합니다. (폰 시계와 무관)
      IS_WEEKEND = /\((토|일)\)/.test(data.dateLabel || '');
      // v30: 종료·예정 화면에는 날짜를 적지 않고 무엇을 보는지만 적습니다.
      var dl = document.getElementById('dateLabel');
      if (dl) dl.textContent = VIEW.isPast ? '어제 종료' : (VIEW.isFuture ? '내일 예정' : (data.dateLabel || ''));
      var nav = document.getElementById('daynav');
      if (nav) nav.innerHTML = navHtml(data);
      var list = document.getElementById('list');
      var html = '';
      if (VIEW.isPast) {
        // v30.1: 총 인원 요약 카드는 유지, 종료 서류는 v23~v26 상세 목록으로 복구 (예찬님 지시)
        html = endSumHtml(data) + closeDocsHtml(data) + autoSectionHtml();   // v34: 맨 아래 자동화 ON/OFF (관리자만)
      } else if (VIEW.isFuture) {
        // v30.1: 시작 예정 · 계속 진행 인원 요약은 유지, 교육대기는 v29 상세 카드로 복구 (예찬님 지시)
        // v31: 요약 카드 아래에 폴라리스 통합시트 예정 산모 목록, 교육대기는 맨 뒤 (예찬님 지시)
        html = planSumHtml(data) + polarisSection(data) + eduSection(data);
      } else if (!data.items || !data.items.length) {
        // v28: 주말(토·일)은 캘린더 기간을 무시하고 실제 근무표 기록만 보므로, 비어 있는 게 정상입니다.
        html = IS_WEEKEND
          ? '<div class="empty">주말(토·일)은 기본 휴무입니다.<br>근무표에 올라온 사람만 표시돼요.</div>'
          : '<div class="empty">오늘 배정이 없습니다.</div>';
        // v28: 주말이라 목록이 비어 있어도 '내일 시작'(일요일이면 월요일 시작 산모)은 그대로 보여 줍니다.
        html += tomorrowSection(data);
      } else {
        var items = data.items;
        var i = 0;
        while (i < items.length) {
          var it = items[i];
          if (it.twin && it.groupSize > 1) {
            var group = [it];
            var j = i + 1;
            while (j < items.length && items[j].twin && items[j].groupSize > 1 && items[j].mother === it.mother) {
              group.push(items[j]);
              j++;
            }
            if (group.length > 1) {
              html += twinHtml(group, i);
              i = j;
              continue;
            }
          }
          html += rowHtml(it, i);
          i++;
        }
        html += tomorrowSection(data);   // v18: 내일 시작 (있을 때만)
      }
      list.innerHTML = html;
      if (VIEW.isPast && isAdmin_()) loadAutomations(false);   // v34: 자동화 ON/OFF 는 이때만 따로 받습니다
      var cEl = document.getElementById('count');
      if (VIEW.isToday) updateCount();
      else if (cEl) cEl.textContent = VIEW.isPast
        ? cardCountText_(data)                       // v34: 어제도 '카드체크 X/Y' (일반 산모는 +N)
        : ('예정 ' + planCare_(data) + '명');
      // v34: 문자 안내 문구창은 [오늘] 탭에서만 보입니다. (종료·예정 탭에서는 감춥니다)
      var mbox = document.querySelector('.msgbox');
      if (mbox) mbox.style.display = VIEW.isToday ? '' : 'none';
      saveCache();   // v30: 세 탭을 이 기기에 저장 (잠그면 지움)
      if (VIEW.isToday && !data.hasTodayColumn) toast(data.sheetName + '에 오늘 날짜 열이 없습니다.');
      else if (VIEW.isPast && data.hasDateColumn === false) toast(data.sheetName + '에 ' + VIEW.short + ' 열이 없습니다.');
    }

    /* ── v30.1: 종료 화면 — 총 인원 요약 + 종료 서류 상세(v23~v26 복구) ──
       근무쌍(산모─관리사) 목록 대신 총 인원 카드만 보여 주는 것은 v30 그대로 두고,
       v30 에서 숫자로 줄였던 종료 서류는 상세 목록으로 되돌렸습니다. (예찬님 지시)
       인원은 관리사 수 기준이고, 쌍둥이는 두 관리사가 각각 1명으로 셉니다. */
    function sumCare_(d) { return (d && d.sum && typeof d.sum.caregivers === 'number') ? d.sum.caregivers : 0; }
    function sumMoms_(d) { return (d && d.sum && typeof d.sum.mothers === 'number') ? d.sum.mothers : 0; }
    function planCare_(d) { return (d && d.plan) ? ((d.plan.start || 0) + (d.plan.cont || 0)) : 0; }

    /* v34: [종료] 화면 카드체크 — 서버가 센 값(sum.card)을 그대로 씁니다.
       checked = 근무표에 이름이 적힌 (산모·관리사) 짝, total = 그 날 배정된 짝,
       normal = 카드체크 대상이 아닌 '일반' 산모 수(화면에는 '+N').
       쌍둥이는 관리사마다 1개씩 따로 셉니다. */
    function cardNums_(d) {
      var c = (d && d.sum && d.sum.card) ? d.sum.card : null;
      if (!c) return { checked: 0, total: 0, normal: 0 };
      return { checked: c.checked || 0, total: c.total || 0, normal: c.normal || 0 };
    }
    function cardCountText_(d) {
      var c = cardNums_(d);
      return '카드체크 ' + c.checked + '/' + c.total + (c.normal ? ' +' + c.normal : '');
    }

    function endSumHtml(data) {
      var c = cardNums_(data);
      var sub = '';
      if (!c.total) {
        sub = IS_WEEKEND ? '주말은 기본 휴무 · 근무표에 올라온 사람만 셉니다' : '어제 카드체크한 근무가 없습니다';
      } else {
        sub = (c.normal ? '일반 산모 +' + c.normal + ' · ' : '') + '관리사 기준 (쌍둥이는 각각)';
      }
      var h = '<section class="sumwrap">' +
        '<div class="sumcard green">' +
          '<div class="sttl">어제 카드체크</div>' +
          '<div class="sumbig"><b>' + c.checked + '</b><span>/' + c.total + '</span></div>' +
          '<div class="sumsub">' + esc(sub) + '</div>' +
        '</div>';

      return h + '</section>';   // v30.1: 종료 서류 숫자 카드는 빼고, 뒤에 상세 목록을 붙입니다
    }

    /* ── v30.1: 예정 화면 — 시작·계속 인원 요약 + 교육대기 상세(v29 복구) ──
       v30 에서 인원 요약으로 줄였던 교육대기는 v29 의 상세 카드·모달로 되돌렸습니다. (예찬님 지시) */
    function planSumHtml(data) {
      var p = data.plan || { start: 0, cont: 0, trainee: 0 };
      var start = p.start || 0, cont = p.cont || 0;
      var h = '<section class="sumwrap">' +
        '<div class="sumcard green">' +
          '<div class="sttl">내일 예정</div>' +
          '<div class="sumbig"><b>' + (start + cont) + '</b><span>명</span></div>' +
          '<div class="sumsub">관리사 기준 (쌍둥이는 각각)</div>' +
        '</div>' +
        '<div class="sumcard">' +
          '<div class="sttl">출근 예정</div>' +
          '<div class="sumline"><span class="snm">📌 새로 시작</span><span class="svals">' +
            '<span class="snum' + (start ? '' : ' miss') + '">' + start + '명</span></span></div>' +
          '<div class="sumline"><span class="snm">🔁 계속 진행</span><span class="svals">' +
            '<span class="snum">' + cont + '명</span></span></div>' +
        '</div>';

      return h + '</section>';   // v30.1: 교육대기 숫자 카드는 빼고, 뒤에 v29 상세 카드를 붙입니다
    }

    /* ── v31: 예정 화면 — 폴라리스 통합시트 예정 산모 ──────────────────
       김정현님 폴라리스 '2026년 통합시트'를 옮긴 [예정산모] 탭을 서버가 읽어
       days.upcoming.polarisUpcoming 으로 내려 줍니다. (오늘 이후 시작만)
       v31.2: 화면에서 정렬합니다. 기본은 시작일 오름차순(가까운 순),
              헤더 오른쪽 단추로 내림차순(먼 순)과 전환합니다.
       v31.3: 자부담 배지를 추가하고([예정산모] H열 → 서버 selfPay), 배지 4개가
              폰 한 줄에 들어가도록 합니다. 바우처가 '논산'·'계룡'이면 등록 완료와 같은 초록.
              배지는 고정폭(66px)·가운데 정렬로 세로 일렬, 관리사명이 길면 관리사만 말줄임.
       폰 한 화면에 여러 명이 들어오도록 한 명을 두 줄로 줄여 그립니다.
         이름 · 기간        시작일(YY.MM.DD)
         관리사              바우처 · 계약서 · 예약금 · 자부담 배지 */
    function pDate_(s) {                      // 'YYYY-MM-DD' → 'YY.MM.DD'
      s = String(s == null ? '' : s);
      return s.length >= 10 ? (s.slice(2, 4) + '.' + s.slice(5, 7) + '.' + s.slice(8, 10)) : s;
    }
    function pTerm_(m) {                      // 기간 '15' → '15일', '2달(입주)' → 그대로
      m = String(m == null ? '' : m).trim();
      if (!m) return '';
      return /^\d+$/.test(m) ? (m + '일') : m;
    }
    function pBadge_(label, v) {
      var t = String(v == null ? '' : v).trim();
      /* v31.3: '완료' 외에 바우처 등록 지역이 적힌 값('논산'·'계룡' 등)도 등록 완료(초록)로 봅니다.
         대기=주황, '없음'·빈칸=회색(빈칸은 '-' 로 표시) */
      var k = (t === '완료' || /논산|계룡/.test(t)) ? 'ok' : ((t && t !== '없음') ? 'wait' : 'none');
      return '<span class="pbadge ' + k + '">' + esc(label + ' ' + (t || '-')) + '</span>';
    }
    function polarisRowHtml(p) {
      var care = String(p.care == null ? '' : p.care).trim();
      var term = pTerm_(p.months);
      return '<div class="pcard">' +
        '<div class="pmain">' +
          '<span class="pname">' + esc(p.name) + '</span>' +
          (term ? '<span class="pterm">' + esc(term) + '</span>' : '') +
          '<span class="pdate">' + esc(pDate_(p.start)) + '</span>' +
        '</div>' +
        '<div class="psub">' +
          '<span class="pcare' + (cardOnly_(p.name, care) ? ' cardonly' : '') + '">' + esc(care || '관리사 미정') + '</span>' +
          '<span class="pbadges">' +
            pBadge_('바우처', p.voucher) + pBadge_('계약서', p.contract) + pBadge_('예약금', p.deposit) +
            pBadge_('자부담', p.selfPay) +
          '</span>' +
        '</div>' +
      '</div>';
    }
    var POLARIS_ASC = true;                   // v31.2: 기본값은 항상 오름차순 (앱을 다시 열면 초기화)
    function polarisSection(data) {
      var list = (data.polarisUpcoming || []).slice(0);
      if (!list.length) return '';            // 예정 산모가 없으면 그리지 않습니다
      list.sort(function (a, b) {             // 시작일 기준 (같은 날은 받은 순서 유지)
        var x = String(a.start == null ? '' : a.start), y = String(b.start == null ? '' : b.start);
        if (x === y) return 0;
        var c = x < y ? -1 : 1;
        return POLARIS_ASC ? c : -c;
      });
      var h = '<section class="tsec" id="polarisSec"><div class="thead">' +
        '<span class="ttl polaris">📋 예정 산모 (' + list.length + '명)</span>' +
        '<span class="tsub">통합시트</span>' +
        '<button class="psort" id="polarisSort" title="눌러서 정렬 방향 바꾸기">' +
          (POLARIS_ASC ? '가까운 순 ⇅' : '먼 순 ⇅') + '</button></div>';
      for (var i = 0; i < list.length; i++) h += polarisRowHtml(list[i]);
      return h + '</section>';
    }
    /* v31.2: 정렬 단추 — 목록만 다시 그려 화면 위치(스크롤)를 유지합니다. */
    function togglePolarisSort() {
      POLARIS_ASC = !POLARIS_ASC;
      var el = document.getElementById('polarisSec');
      if (!el || !DATA) return;
      var tmp = document.createElement('div');
      tmp.innerHTML = polarisSection(DATA);
      if (tmp.firstChild) el.parentNode.replaceChild(tmp.firstChild, el);
    }

    /* ── v23: 탭 이동 (종료 / 오늘 / 예정) ──────────────────────────
       서버가 준 nav(3개) 를 그대로 단추로 그립니다. 날짜 계산은 서버가 하므로
       폰 시계가 달라도 어긋나지 않습니다. v30: 단추에는 이름만 적습니다. */
    var DAY_BUSY = false;
    function navHtml(data) {
      var nv = data.nav || [];
      if (!nv.length) return '';
      var h = '';
      for (var i = 0; i < nv.length; i++) {
        var n = nv[i];
        h += '<button class="dbtn' + (n.active ? ' on' : '') + '" data-day="' + esc(n.date) + '" title="' + esc(n.title) + '">' +
          '<span class="dt">' + esc(n.title) + '</span>' +
        '</button>';
      }
      return h;
    }
    function goDay(date) {
      if (!PIN || !date || DAY_BUSY) return;
      if (VIEW && date === VIEW.date) return;
      // v30: 세 탭은 이미 받아 두었으므로 서버를 부르지 않고 바로 그립니다. (0초)
      var p = findPayload(date);
      if (p) {
        render(p);
        loadStats(false);
        refreshModal();
        return;
      }
      // 메모리에 없는 날짜(예: 자정을 넘겨 날짜가 바뀐 직후)만 서버에서 그 날짜만 받습니다.
      DAY_BUSY = true;
      document.getElementById('list').innerHTML = '<div class="empty">불러오는 중…</div>';
      callApi({ action: 'load', pin: PIN, date: date }).then(function (r) {
        DAY_BUSY = false;
        if (!r || r.ok === false) { toast((r && r.message) || '불러오지 못했어요'); load(); return; }
        render(r);
        loadStats(false);
        refreshModal();
      }, function (e) {
        DAY_BUSY = false;
        toast((e && e.message) || '불러오지 못했어요');
        load();
      });
    }


    /* ── v29: 교육대기 — [관리사목록] '교육예정' 열에 적힌 사람 ───────────
       v30: 예정 화면에서는 인원수만 씁니다. (아래 whenText_ 가 '12월 예정' 표기를 만듭니다) */
    function whenText_(w) {
      w = String(w == null ? '' : w).trim();
      if (!w) return '교육 예정';
      return /예정$/.test(w) ? w : (w + ' 예정');
    }
    /* v29: 인원수는 산모 수가 아니라 관리사 수 (쌍둥이는 각각 1명) */
    /* v30.1: 교육대기 상세 카드 — v29 을 그대로 되돌려 놓았습니다. */
    function careN(list) {
      var n = 0;
      list = list || [];
      for (var i = 0; i < list.length; i++) {
        var it = list[i] || {};
        n += (it.caregivers && it.caregivers.length) ? it.caregivers.length : (it.caregiver ? 1 : 0);
      }
      return n;
    }
    function eduRowHtml(tr, idx) {
      var bad = tr.bad > 0;
      var jisa = tr.jisa ? '<span class="jisa">' + esc(tr.jisa) + '</span>' : '';
      var doc = '<span class="dnum' + (bad ? ' bad' : '') + '">' + (bad ? '서류 ' + tr.bad : '서류 정상') + '</span>';
      return '<div class="row next edu">' +
        '<div class="mnext">' +
          '<button class="trname" data-edu="' + idx + '" title="눌러서 교육 안내 문자 보기">' + esc(tr.name) + '</button>' +
          '<span class="nextbadge edu">' + esc(whenText_(tr.when)) + '</span>' +
        '</div>' +
        '<span class="line"></span>' +
        '<div class="tnames">' +
          '<button class="tredu" data-tr="' + idx + '" title="눌러서 서류·전화 확인">' +
            '<span class="tedu">' + jisa + doc + '</span>' +
          '</button>' +
        '</div>' +
      '</div>';
    }
    function eduSection(data) {
      var tr = data.trainees || [];
      if (!tr.length) return '';        // 교육대기생이 없으면 그리지 않습니다
      var html = '<section class="tsec" style="border-top:0;margin-top:2px;padding-top:0">' +
        '<div class="thead"><span class="ttl edu">🎓 교육대기 (' + tr.length + '명)</span>' +
        '<span class="tsub">교육 후 근무 시작 · 눌러서 서류 확인</span></div>';
      for (var i = 0; i < tr.length; i++) html += eduRowHtml(tr[i], i);
      return html + '</section>';
    }


    /* v23: 발송 상태 문구 — 산모 모달에서 씁니다. */
    function sendText_(st) {
      if (!st) return '미발송';
      if (typeof st === 'string') return st || '미발송';
      return st.text || (st.done ? '완료' : '미발송');
    }
    /* v30.1: 종료 서류 상세 — v23(v26) 을 그대로 되돌려 놓았습니다. */
    /* v33: 종료안내문은 전자서명 앱과 연동 — 링크를 보내고 서명을 기다리는 건은 주황 '서명대기' */
    function badgeHtml(label, st) {
      var done = !!(st && st.done);
      var wait = !!(st && st.state === 'wait');
      return '<span class="bg ' + (done ? 'ok' : (wait ? 'wait' : 'miss')) + '">' + esc(label) + ' ' + esc(sendText_(st)) + '</span>';
    }
    function closeDocsHtml(data) {
      var cd = data.closeDocs || [];
      if (!cd.length) return '';
      var v = data.view || {};
      var td = (data.today || {}).date || '';
      // v26: '어제' 화면에서는 어제 종료분 + 오늘 종료·오늘 발송분을 함께 보여 줍니다.
      //      머리말에는 실제로 들어 있는 종료일 범위를 적습니다. (예: 11/13~11/20 종료)
      var minEnd = '', maxEnd = '';
      for (var k = 0; k < cd.length; k++) {
        if (!cd[k].end) continue;
        if (!minEnd || cd[k].end < minEnd) minEnd = cd[k].end;
        if (!maxEnd || cd[k].end > maxEnd) maxEnd = cd[k].end;
      }
      function shortMd(d) { return d ? (Number(d.slice(5, 7)) + '/' + Number(d.slice(8, 10))) : ''; }
      var sub = v.isPast
        ? (esc(shortMd(minEnd)) + (maxEnd && maxEnd !== minEnd ? '~' + esc(shortMd(maxEnd)) : '') + ' 종료'
           + (td && maxEnd === td ? ' · 오늘 포함' : ''))
        : ('최근 ' + (data.closeDays || 7) + '일 종료');
      var h = '<section class="tsec"><div class="thead">' +
        '<span class="ttl green">🗂 종료 서류 발송</span><span class="tsub">' + sub + '</span>' +
        '</div>';
      for (var i = 0; i < cd.length; i++) {
        var c = cd[i];
        var isTodayEnd = !!(td && c.end === td);
        var due = '';
        if (isTodayEnd) due = '<span class="cdue">오늘 종료</span>';
        h += '<div class="cdrow' + (isTodayEnd ? ' today' : '') + '">' +
          '<div class="cdtop">' +
            '<span class="cm">' + esc(c.mother) + '</span>' +
            '<span class="cdt">' + esc(c.endShort) + ' 종료</span>' + due +
          '</div>' +
          '<div class="cdbs">' + badgeHtml('보건소메일', c.mail) + badgeHtml('종료안내문', c.letter) + '</div>' +
          (c.note ? '<div class="cdnote">' + esc(c.note) + '</div>' : '') +
        '</div>';
      }
      return h + '</section>';
    }

    /* ── v19: 산모별 카드체크 일수·날짜별 내역은 화면이 뜬 뒤 따로 ──────
       첫 load 응답에는 일수 집계가 없습니다. 목록이 뜨면 이 함수가 조용히 한 번 더
       받아 DATA.motherStats 를 채우고, 열려 있는 모달도 그 자리에서 갱신합니다.
       · 2분 안에 이미 받았으면 건너뜀 (30초 자동 동기화에서 매번 부르지 않음)
       · 산모 이름을 눌렀는데 아직 없으면 force=true 로 즉시 요청 */
    var STATS_BUSY = false, STATS_AT = 0, STATS_GAP = 120000;
    function loadStats(force) {
      if (!PIN || STATS_BUSY) return;
      if (!force && STATS_AT && Date.now() - STATS_AT < STATS_GAP) return;
      var names = [], i, rows = DATA.items || [];
      for (i = 0; i < rows.length; i++) if (rows[i].mother && names.indexOf(rows[i].mother) < 0) names.push(rows[i].mother);
      var ts = DATA.tomorrowStarts || [];
      for (i = 0; i < ts.length; i++) if (ts[i].mother && names.indexOf(ts[i].mother) < 0) names.push(ts[i].mother);
      if (!names.length) return;
      STATS_BUSY = true;
      callApi({ action: 'motherStats', pin: PIN, mothers: names }).then(function (r) {
        STATS_BUSY = false;
        if (!r || r.ok === false) return;
        DATA.motherStats = r.motherStats || {};
        if (r.motherAssign) DATA.motherAssign = r.motherAssign;
        STATS_AT = Date.now();
        saveCache();
        refreshModal();
      }, function () { STATS_BUSY = false; });
    }

    function load() {
      if (!PIN) return;
      document.getElementById('list').innerHTML = '<div class="empty">불러오는 중…</div>';
      callAll(PIN).then(function (r) {
        if (!r || r.ok === false) { lockNow((r && r.message) || '다시 잠갔습니다.'); return; }
        applyResponse(r);                 // v30: 세 탭을 한 번에
        // v36.1: 위젯에서 지정한 탭이 남아 있으면 그 탭부터
        var k1 = (START_TAB && payloadOf(START_TAB)) ? START_TAB : viewKey_();
        START_TAB = '';
        renderPayload(k1);
        loadStats(false);
        refreshModal();
      }, function (e) {
        document.getElementById('list').innerHTML = '<div class="empty">불러오지 못했습니다.<br>' + esc(e.message || e) + '</div>';
      });
    }

    /* ── v15: 조용한 자동 동기화 ──────────────────────────────────────
       시트에서 근무표를 고치고 폰으로 돌아오거나(visibilitychange/focus),
       패널을 열 때 최신 시트 상태를 다시 읽어 목록·일수·열려 있는 패널까지
       화면 깜빡임 없이 갱신합니다.
       · PIN 잠금 상태·로그인 전·저장 요청 중에는 부르지 않습니다.
       · 직전 로드 후 SYNC_GAP(4초) 안이면 건너뜁니다. */
    function syncQuiet(force) {
      if (!PIN || PIN_BUSY || SYNCING || PENDING > 0) return;
      if (VIEW && !VIEW.isToday) return;      // v23: 어제·내일 화면은 자동 동기화하지 않습니다 (서버 사용 한도 절약)
      var lockEl = document.getElementById('lock');
      if (!lockEl || !lockEl.classList.contains('hide')) return;
      if (document.visibilityState && document.visibilityState !== 'visible') return;
      if (!force && Date.now() - LAST_LOAD < SYNC_GAP) return;
      SYNCING = true;
      callAll(PIN).then(function (r) {
        SYNCING = false;
        if (!r) return;
        if (r.ok === false) {
          // 계정 잠금만 잠금 화면으로. 일시적 오류는 화면을 그대로 두고 다음에 다시.
          if (r.locked) lockNow(r.message || '잠갔습니다. 비밀번호를 입력하세요.');
          return;
        }
        applyResponse(r);                 // v30: 세 탭을 조용히 갱신
        renderPayload(viewKey_());
        loadStats(false);
        refreshModal();
      }, function () { SYNCING = false; });
    }

    /* 열려 있는 패널을 최신 DATA로 다시 그립니다. (스크롤 위치 유지) */
    function refreshModal() {
      if (!MODAL) return;
      // v29: 교육대기생 패널 — 이름으로 다시 찾아 최신 서류로 그립니다. (v30.1 복구)
      if (MODAL.kind === 'trainee') {
        var trs = DATA.trainees || [], ti = -1;
        for (var tt = 0; tt < trs.length; tt++) if (trs[tt].name === MODAL.key) { ti = tt; break; }
        if (ti < 0) return;
        var boxT = document.getElementById('sheetbox'), keepT = boxT.scrollTop;
        openTrainee(ti);
        boxT.scrollTop = keepT;
        return;
      }
      // v34: 교육 안내 문자 모달은 스스로 값을 유지합니다. (다시 그리지 않음)
      if (MODAL.kind === 'edu') return;
      var list = DATA.items || [], idx = -1, i;
      for (i = 0; i < list.length; i++) {
        if (MODAL.kind === 'docs' ? list[i].caregiver === MODAL.key : list[i].mother === MODAL.key) { idx = i; break; }
      }
      if (idx < 0) return;
      var box = document.getElementById('sheetbox'), keep = box.scrollTop;
      if (MODAL.kind === 'docs') openDocs(idx); else openMother(idx);
      box.scrollTop = keep;
    }

    /* 폰으로 돌아왔을 때(앱 전환·화면 켬·탭 포커스) 조용히 최신 시트로 갱신 */
    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState === 'visible') syncQuiet(false);
    });
    window.addEventListener('focus', function () { syncQuiet(false); });
    window.addEventListener('pageshow', function () { syncQuiet(false); });

    /* v15: 화면이 켜져 있는 동안 30초마다 가볍게 최신 상태를 확인합니다.
       (숨김·잠금·저장 중에는 쉼 → 사용 한도를 아낌) */
    var SYNC_TICK = 30000;
    setInterval(function () {
      if (!PIN || PIN_BUSY || SYNCING || PENDING > 0) return;
      if (document.visibilityState && document.visibilityState !== 'visible') return;
      if (Date.now() - LAST_LOAD < SYNC_TICK - 5000) return;
      syncQuiet(true);
    }, SYNC_TICK);

    document.getElementById('reload').addEventListener('cl'+'ick', load);
    document.getElementById('lockBtn').addEventListener('cl'+'ick', function () { lockNow(); });
    document.getElementById('remember').addEventListener('change', function () {
      if (PIN) writeStoredPin(PIN, this.checked);
    });

    var msgEl = document.getElementById('msg');
    try {
      var saved = window["loc"+"al"+"Sto"+"rage"].getItem(MSG_KEY);
      msgEl.value = (saved === null || saved === '') ? DEFAULT_MSG : saved;
    } catch (e) { msgEl.value = DEFAULT_MSG; }
    msgEl.addEventListener('input', function () {
      try { window["loc"+"al"+"Sto"+"rage"].setItem(MSG_KEY, msgEl.value); } catch (e) {}
    });

    /* ── v15: 산모 카드체크 일수 미리 맞추기 ───────────────────────────
       저장 요청을 보낸 직후, 서버 응답을 기다리지 않고 그 산모의 오늘 하루를
       일수·날짜별 내역에 먼저 반영합니다. (응답이 오면 서버 계산값으로 덮어씀) */
    function todayParts() {
      // v23: 화면에 보이는 날짜가 아니라 '오늘'(서버 기준)을 씁니다.
      var src = (DATA.today && DATA.today.label) || DATA.dateLabel || '';
      var m = String(src).match(/(\d{4})-(\d{1,2})-(\d{1,2})\s*\(([^)]+)\)/);
      if (!m) return null;
      return { y: Number(m[1]), m: Number(m[2]), d: Number(m[3]), dow: m[4] };
    }
    function rebuildStats(st) {
      var bm = {}, recs = 0, i;
      for (i = 0; i < st.days.length; i++) {
        var d = st.days[i], n = d.n || 1;
        recs += n;
        if (!bm[d.m]) bm[d.m] = { days: 0, records: 0 };
        bm[d.m].days++;
        bm[d.m].records += n;
      }
      st.days.sort(function (a, b) { return (b.m - a.m) || (b.d - a.d); });
      st.byMonth = bm;
      st.records = recs;
      st.totalDays = st.days.length;
    }
    function applyLocalToggle(mother, caregiver, on) {
      var st = (DATA.motherStats || {})[mother];
      var tp = todayParts();
      if (!st || !tp) return false;
      st.days = st.days || [];
      var idx = -1, i;
      for (i = 0; i < st.days.length; i++) {
        if (st.days[i].m === tp.m && st.days[i].d === tp.d) { idx = i; break; }
      }
      if (on) {
        if (idx < 0) {
          st.days.push({ m: tp.m, d: tp.d, date: tp.m + '/' + tp.d, dow: tp.dow, n: 1, care: caregiver });
        } else {
          var parts = String(st.days[idx].care || '').split(' · '), has = false;
          for (i = 0; i < parts.length; i++) if (parts[i] === caregiver) has = true;
          if (!has) {
            parts.push(caregiver);
            st.days[idx].care = parts.join(' · ');
            st.days[idx].n = (st.days[idx].n || 1) + 1;
          }
        }
      } else if (idx >= 0) {
        var ps = String(st.days[idx].care || '').split(' · '), keep = [];
        for (i = 0; i < ps.length; i++) if (ps[i] && ps[i] !== caregiver) keep.push(ps[i]);
        if (keep.length) {
          st.days[idx].care = keep.join(' · ');
          st.days[idx].n = keep.length;
        } else {
          st.days.splice(idx, 1);
        }
      }
      rebuildStats(st);
      return true;
    }
    /* 서버가 계산한 최신 일수·배정으로 교체 */
    function mergeServerStats(r, mother) {
      if (r && r.motherStats && r.motherStats[mother]) {
        DATA.motherStats = DATA.motherStats || {};
        DATA.motherStats[mother] = r.motherStats[mother];
      }
      if (r && r.motherAssign && DATA.motherAssign) {
        for (var k in r.motherAssign) {
          if (r.motherAssign.hasOwnProperty(k)) DATA.motherAssign[k] = r.motherAssign[k];
        }
      }
    }

    document.addEventListener('change', function (ev) {
      var cb = ev.target;
      if (!cb || cb.type !== 'checkbox' || cb.id === 'remember') return;
      var idx = Number(cb.dataset.idx);
      var it = DATA.items[idx];
      if (!it) return;
      // v20: 보기 전용은 시트를 바꿀 수 없습니다. (서버도 관리자 PIN 인지 다시 확인해 거부)
      if (!isAdmin_()) {
        cb.checked = !!it.checked;
        toast(VIEWER_MSG);
        return;
      }
      // v19: 기억된 화면을 먼저 그린 상태(PIN 확인 전)에는 시트를 건드리지 않습니다.
      if (!PIN) { cb.checked = !!it.checked; toast('비밀번호를 확인하는 중이에요. 잠시만 기다려 주세요.'); return; }
      // v16: '일반' 신청 산모는 카드체크 대상이 아니므로 시트에 쓰지 않고 완료 상태를 유지합니다.
      if (it.isNormal) {
        cb.checked = true;
        it.checked = true;
        updateCount();
        toast('일반 산모는 카드체크가 필요 없어 완료로 표시돼요');
        return;
      }
      var want = cb.checked;
      var mother = it.mother, caregiver = it.caregiver;
      var smsBtn = document.querySelector('.sms[data-sms="' + cb.dataset.idx + '"]');
      PENDING++;
      cb.disabled = true;
      it.checked = want;
      if (smsBtn) smsBtn.classList.toggle('hide', want);
      applyLocalToggle(mother, caregiver, want);   // v15: 일수 즉시 반영
      updateCount();
      refreshModal();                              // v15: 열려 있는 패널도 바로
      callApi({ action: 'setCard', pin: PIN, mother: mother, caregiver: caregiver, on: want }).then(function (r) {
        PENDING--;
        cb.disabled = false;
        if (!r || !r.ok) {
          cb.checked = !want;
          it.checked = !want;
          if (smsBtn) smsBtn.classList.toggle('hide', !want);
          applyLocalToggle(mother, caregiver, !want);   // v15: 미리 반영한 것 되돌리기
          updateCount();
          refreshModal();
          toast((r && r.message) || '저장하지 못했습니다.');
          return;
        }
        cb.checked = !!(r.value && r.value.length);
        it.checked = cb.checked;
        it.memo = r.value || '';
        if (smsBtn) smsBtn.classList.toggle('hide', it.checked);
        mergeServerStats(r, mother);   // v15: 서버가 계산한 최신 일수로 교체
        updateCount();
        refreshModal();
      }, function (e) {
        PENDING--;
        cb.disabled = false;
        cb.checked = !want;
        it.checked = !want;
        if (smsBtn) smsBtn.classList.toggle('hide', !want);
        applyLocalToggle(mother, caregiver, !want);
        updateCount();
        refreshModal();
        toast((e && e.message) || '저장하지 못했습니다.');
      });
    });

    function copyText(text) {
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(function () {
            toast('문구가 복사되었어요');
          }, function () { fallbackCopy(text); });
          return;
        }
      } catch (e) {}
      fallbackCopy(text);
    }
    function fallbackCopy(text) {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      ta.style.position = 'fixed';
      ta.style.left = '-9999px';
      document.body.appendChild(ta);
      ta.select();
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (e) {}
      document.body.removeChild(ta);
      toast(ok ? '문구가 복사되었어요' : '복사하지 못했어요');
    }

    function sendSms(idx) {
      var it = DATA.items[idx];
      if (!it) return;
      var num = String(it.phone || '').replace(/[^0-9]/g, '');
      var tpl = (msgEl.value || '').trim() || DEFAULT_MSG;
      var body = tpl.split('{관리사}').join(it.caregiver).split('{산모}').join(it.mother);
      copyText(body);
      if (!num) { toast('전화번호가 없어 문자 앱은 열 수 없어요. 문구는 복사했어요.'); return; }
      var iOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
      var href = 'sm'+'s:' + num + (iOS ? '&body=' : '?body=') + encodeURIComponent(body);
      var a = document.createElement('a');
      a.href = href;
      a.target = '_top';
      a.rel = 'noopener';
      document.body.appendChild(a);
      a['cl'+'ick']();
      setTimeout(function () { a.remove(); }, 600);
    }

    document.addEventListener('click', function (ev) {
      // v31.2: 예정 산모 정렬 방향 전환
      var sbtn = ev.target.closest ? ev.target.closest('#polarisSort') : null;
      if (sbtn) { togglePolarisSort(); return; }
      // v20: 보기 전용에서는 체크박스를 눌러도 상태가 바뀌지 않고 안내만 합니다.
      var rochk = ev.target.closest ? ev.target.closest('.chk.ro') : null;
      if (rochk && !isAdmin_()) { ev.preventDefault(); toast(VIEWER_MSG); return; }
      var dayBtn = ev.target.closest ? ev.target.closest('.dbtn[data-day]') : null;
      if (dayBtn) { goDay(dayBtn.getAttribute('data-day')); return; }
      var tbtn = ev.target.closest ? ev.target.closest('.tbtn[data-idx]') : null;
      if (tbtn) { syncQuiet(false); openDocs(Number(tbtn.getAttribute('data-idx'))); return; }
      var sms = ev.target.closest ? ev.target.closest('.sms') : null;
      if (sms) { sendSms(Number(sms.dataset.sms)); return; }
      var mom = ev.target.closest ? ev.target.closest('.mother[data-mom]') : null;
      if (mom) { syncQuiet(false); openMother(Number(mom.getAttribute('data-mom'))); return; }
      // v34: 교육대기 이름 → 교육 안내 문자 모달 / 자동화 토글 / 모달 안 단추
      var edbtn = ev.target.closest ? ev.target.closest('[data-edu]') : null;
      if (edbtn) { openEdu(Number(edbtn.getAttribute('data-edu'))); return; }
      var tog = ev.target.closest ? ev.target.closest('.autog[data-auto]') : null;
      if (tog) { toggleAuto(tog.getAttribute('data-auto'), tog.getAttribute('data-on') !== '1', tog); return; }
      if (ev.target.id === 'eduCopy') { eduCopy_(); return; }
      if (ev.target.id === 'eduSms') { eduSms_(); return; }
      if (ev.target.id === 'eduDocs') { if (EDU.idx >= 0) openTrainee(EDU.idx); return; }
      // v29: 교육대기생 카드 — 서류·전화 모달 (v30.1 복구)
      var trbtn = ev.target.closest ? ev.target.closest('[data-tr]') : null;
      if (trbtn) { openTrainee(Number(trbtn.getAttribute('data-tr'))); return; }
      var btn = ev.target.closest ? ev.target.closest('.care') : null;
      if (btn) { syncQuiet(false); openDocs(Number(btn.dataset.idx)); return; }
      if (ev.target.id === 'modal' || ev.target.id === 'closeModal') closeModal();
    });

    function openDocs(idx) {
      var it = DATA.items[idx];
      if (!it) return;
      MODAL = { kind: 'docs', key: it.caregiver };
      var bad = 0, rows = '';
      for (var i = 0; i < it.docs.length; i++) {
        var d = it.docs[i];
        if (d.counted && (d.status === 'expired' || d.status === 'missing')) bad++;
        rows += '<div class="doc">' +
          '<span class="nm">' + esc(d.label) + '</span>' +
          '<span class="dt">' + esc(d.date) + '</span>' +
          '<span class="st ' + d.status + '">' + esc(d.statusText) + '</span>' +
        '</div>';
      }
      if (!it.docs || !it.docs.length) rows = '<div class="doc"><span class="nm">시트에 서류 정보가 없습니다</span></div>';
      var head = bad > 0 ? '서류 부족·만료 ' + bad + '건' : '서류 정상';
      var drive = it.folder
        ? '<a class="btn primary" href="' + esc(it.folder) + '" target="_top">드라이브 서류 폴더 열기</a>'
        : '<span class="btn" style="color:#8a8f8a">폴더를 찾지 못했습니다</span>';
      document.getElementById('sheetbox').innerHTML =
        '<h2' + (cardOnly_(it.mother, it.caregiver) ? ' class="cardonly"' : '') + '>' + esc(it.caregiver) + '</h2>' +
        '<div class="meta">' + esc(it.mother) + ' 산모 담당 · ' + esc(head) + '</div>' +
        '<div class="docs">' + rows + '</div>' +
        '<div class="actions">' + drive + '<button class="btn" id="closeModal">닫기</button></div>';
      document.getElementById('modal').classList.add('open');
    }
    /* v29: 교육대기생 — 서류 8종 · 드라이브 폴더 · 전화번호 (v30.1: v29 그대로 복구) */
    function openTrainee(idx) {
      var tr = (DATA.trainees || [])[idx];
      if (!tr) return;
      MODAL = { kind: 'trainee', key: tr.name };
      var bad = 0, rows = '', i;
      for (i = 0; i < (tr.docs || []).length; i++) {
        var d = tr.docs[i];
        if (d.counted && (d.status === 'expired' || d.status === 'missing')) bad++;
        rows += '<div class="doc">' +
          '<span class="nm">' + esc(d.label) + '</span>' +
          '<span class="dt">' + esc(d.date) + '</span>' +
          '<span class="st ' + d.status + '">' + esc(d.statusText) + '</span>' +
        '</div>';
      }
      if (!tr.docs || !tr.docs.length) rows = '<div class="doc"><span class="nm">시트에 서류 정보가 없습니다</span></div>';
      var head = bad > 0 ? '서류 부족·만료 ' + bad + '건' : '서류 정상';
      var meta = [];
      meta.push('교육대기 · ' + whenText_(tr.when));
      if (tr.jisa) meta.push(tr.jisa);
      if (tr.phone) meta.push(tr.phone);
      meta.push(head);
      var drive = tr.folder
        ? '<a class="btn primary" href="' + esc(tr.folder) + '" target="_top">서류 폴더</a>'
        : '<span class="btn" style="color:#8a8f8a">폴더 없음</span>';
      var tel = tr.phone
        ? '<a class="btn" href="tel:' + esc(String(tr.phone).replace(/[^0-9+]/g, '')) + '" title="' + esc(tr.phone) + '">📞 전화</a>'
        : '<span class="btn" style="color:#8a8f8a">번호 없음</span>';
      document.getElementById('sheetbox').innerHTML =
        '<h2>' + esc(tr.name) + '</h2>' +
        '<div class="meta">' + esc(meta.join(' · ')) + '</div>' +
        '<div class="docs">' + rows + '</div>' +
        '<div class="actions">' + drive + tel + '<button class="btn" id="closeModal">닫기</button></div>';
      document.getElementById('modal').classList.add('open');
    }
    /* ══ v34: [종료] 탭 하단 자동화 ON/OFF ══════════════════════════
       · 관리자 PIN 일 때만 그립니다. (보기 전용에는 목록 자체를 내려보내지 않습니다)
       · 첫 화면(loadAll)에는 넣지 않고, [종료] 탭을 열 때 action:'getAutomations' 로 따로 받습니다.
       · 토글은 action:'toggleAutomation' — 서버가 관리자 PIN 인지 다시 확인합니다. */
    var AUTOS = null, AUTOS_AT = 0, AUTOS_BUSY = false, AUTOS_GAP = 60000;

    function autoSectionHtml() {
      if (!isAdmin_()) return '';
      return '<section class="autosec" id="autoSec">' +
        '<div class="ahead">⚙️ 자동화 ON/OFF</div>' +
        '<div class="asub">꺼 두면 그 자동화는 다음 실행부터 건너뜁니다.</div>' +
        '<div id="autoList">' + autoListHtml() + '</div>' +
        '<div class="astamp" id="autoStamp"></div>' +
      '</section>';
    }

    function autoListHtml() {
      if (!AUTOS) return '<div class="aurow"><div class="an"><b>불러오는 중…</b></div></div>';
      if (!AUTOS.length) return '<div class="aurow"><div class="an"><b>자동화 목록이 비어 있습니다</b>' +
        '<span>탄야깐 요청관리 > 자동화 ON/OFF 탭을 확인해 주세요.</span></div></div>';
      var h = '';
      for (var i = 0; i < AUTOS.length; i++) {
        var a = AUTOS[i] || {};
        h += '<div class="aurow">' +
          '<div class="an"><b>' + esc(a.name || a.key) + '</b><span>' + esc(a.desc || '') + '</span></div>' +
          '<button type="button" class="autog' + (a.on ? ' on' : '') + '" data-auto="' + esc(a.key) + '"' +
            ' data-on="' + (a.on ? '1' : '0') + '" role="switch" aria-checked="' + (a.on ? 'true' : 'false') + '"' +
            ' aria-label="' + esc((a.name || a.key) + (a.on ? ' 켜짐' : ' 꺼짐')) + '"' +
            ' title="' + (a.on ? '켜짐 · 눌러서 끄기' : '꺼짐 · 눌러서 켜기') + '"><i></i></button>' +
        '</div>';
      }
      return h;
    }

    function loadAutomations(force) {
      if (!PIN || !isAdmin_()) return;
      if (AUTOS_BUSY) return;
      if (!force && AUTOS && Date.now() - AUTOS_AT < AUTOS_GAP) { paintAutos(); return; }
      AUTOS_BUSY = true;
      callApi({ action: 'getAutomations', pin: PIN }).then(function (r) {
        AUTOS_BUSY = false;
        if (!r) return;
        if (r.ok === false) {
          var box = document.getElementById('autoList');
          if (box) box.innerHTML = '<div class="aurow"><div class="an"><b>자동화 목록을 받지 못했어요</b>' +
            '<span>' + esc(r.message || '') + '</span></div></div>';
          return;
        }
        AUTOS = r.automations || [];
        AUTOS_AT = Date.now();
        paintAutos();
      }, function () {
        AUTOS_BUSY = false;
        var box = document.getElementById('autoList');
        if (box) box.innerHTML = '<div class="aurow"><div class="an"><b>연결하지 못했어요</b>' +
          '<span>잠시 후 [종료] 탭을 다시 열어 주세요.</span></div></div>';
      });
    }

    function paintAutos() {
      var box = document.getElementById('autoList');
      if (box) box.innerHTML = autoListHtml();
      var st = document.getElementById('autoStamp');
      if (!st) return;
      if (!AUTOS || !AUTOS.length) { st.textContent = ''; return; }
      var last = '';
      for (var i = 0; i < AUTOS.length; i++) if (AUTOS[i].changed && AUTOS[i].changed > last) last = AUTOS[i].changed;
      st.textContent = last ? ('마지막 변경 ' + last) : '';
    }

    function toggleAuto(key, on, btn) {
      if (!isAdmin_()) { toast(VIEWER_MSG); return; }
      if (!PIN || !key) return;
      if (btn) btn.disabled = true;
      PENDING++;
      callApi({ action: 'toggleAutomation', pin: PIN, key: key, on: !!on }).then(function (r) {
        PENDING--;
        if (btn) btn.disabled = false;
        if (!r || r.ok === false) { toast((r && r.message) || '바꾸지 못했어요'); return; }
        AUTOS = r.automations || AUTOS;
        AUTOS_AT = Date.now();
        paintAutos();
        toast((String(r.status).toUpperCase() === 'ON' ? '켜짐' : '꺼짐') + '으로 저장했어요');
      }, function () {
        PENDING--;
        if (btn) btn.disabled = false;
        toast('연결하지 못했어요. 다시 시도해 주세요.');
      });
    }

    /* ══ v34: 교육대기 '교육 안내 문자' 모달 ═══════════════════════════
       [예정] 탭의 교육대기 인원 이름을 누르면 열립니다.
       · 위의 '교육 시작일'을 바꾸면 본문의 연도·월·일·요일이 그 자리에서 함께 바뀝니다.
       · 본문은 직접 고칠 수 있고, 복사하거나 문자(sms:)로 바로 보낼 수 있습니다. */
    var EDU = { idx: -1, date: '', last: null };
    var WD_KO = ['일', '월', '화', '수', '목', '금', '토'];

    function eduPad_(n) { return (n < 10 ? '0' : '') + n; }
    function eduYmd_(d) { return d.getFullYear() + '-' + eduPad_(d.getMonth() + 1) + '-' + eduPad_(d.getDate()); }
    function eduParse_(s) {
      var m = String(s == null ? '' : s).match(/^(\d{4})-(\d{2})-(\d{2})$/);
      if (!m) return null;
      return new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
    }
    function eduDateText_(d) {
      return d.getFullYear() + '년 ' + (d.getMonth() + 1) + '월 ' + d.getDate() + '일 (' + WD_KO[d.getDay()] + ')';
    }
    function eduMdText_(d) {
      return (d.getMonth() + 1) + '월 ' + d.getDate() + '일(' + WD_KO[d.getDay()] + ')';
    }
    /* 교육 시작일 기본값 — '교육예정'에 적힌 달의 1일(주말이면 월요일로) */
    function eduBaseDate_(tr) {
      var tp = todayParts();
      var y = tp ? tp.y : new Date().getFullYear();
      var tm = tp ? tp.m : (new Date().getMonth() + 1);
      var w = String((tr && tr.when) || '');
      var mm = w.match(/(\d{1,2})\s*월/);
      var m = mm ? Number(mm[1]) : tm;
      if (m < tm) y += 1;                      // '1월 교육'을 12월에 안내하면 다음 해
      var d = new Date(y, m - 1, 1);
      while (d.getDay() === 0 || d.getDay() === 6) d.setDate(d.getDate() + 1);
      return d;
    }
    function eduTemplate_(tr, d) {
      var name = (tr && tr.name) ? String(tr.name).replace(/\s*\([^)]*\)\s*/g, ' ').replace(/\s+/g, ' ').trim() : '';
      if (!name) name = '선생님';    // '김성재(노인취업지원센터)' → '김성재'
      var jisa = (tr && tr.jisa) ? String(tr.jisa) : '';
      return '안녕하세요, ' + name + ' 선생님. 가온누리입니다.\n' +
        '\n요양보호사 교육 일정을 안내드립니다.\n' +
        '\n· 교육 시작일: ' + eduDateText_(d) + '\n' +
        '· 교육 장소·시간: 따로 안내드립니다\n' +
        '· 준비물: 신분증, 필기도구\n' +
        '\n교육 시작 전날 다시 연락드리겠습니다.\n' +
        '\n감사합니다.' + (jisa ? ('\n\n' + jisa + ' 가온누리') : '');
    }
    function eduFill_(tr, d, keepEdits) {
      var ta = document.getElementById('eduMsg');
      if (!ta || !d) return;
      var cur = { D: eduDateText_(d), MD: eduMdText_(d), Y: String(d.getFullYear()) };
      var text = eduTemplate_(tr, d);
      if (keepEdits && EDU.last && ta.value) {
        // 본문을 고쳤어도 날짜 글자만 새 값으로 바꿔 줍니다.
        text = ta.value;
        if (EDU.last.D && EDU.last.D !== cur.D) text = text.split(EDU.last.D).join(cur.D);
        if (EDU.last.MD && EDU.last.MD !== cur.MD) text = text.split(EDU.last.MD).join(cur.MD);
        if (EDU.last.Y && EDU.last.Y !== cur.Y) text = text.split(EDU.last.Y + '년').join(cur.Y + '년');
      }
      ta.value = text;
      EDU.last = cur;
    }
    function openEdu(idx) {
      var tr = (DATA.trainees || [])[idx];
      if (!tr) return;
      MODAL = { kind: 'edu', key: tr.name };
      EDU.idx = idx;
      EDU.last = null;
      var base = eduBaseDate_(tr);
      EDU.date = eduYmd_(base);
      var info = [];
      if (tr.when) info.push(whenText_(tr.when));
      if (tr.jisa) info.push(tr.jisa);
      if (tr.phone) info.push(tr.phone);
      document.getElementById('sheetbox').innerHTML =
        '<h2>' + esc(tr.name) + ' <span class="nbadge">교육대기</span></h2>' +
        '<div class="mcount">' + esc(info.join(' · ')) + '</div>' +
        '<div class="edudate"><span>교육 시작일</span><input type="date" id="eduDate" value="' + esc(EDU.date) + '"></div>' +
        '<textarea class="edumsg" id="eduMsg" spellcheck="false"></textarea>' +
        '<div class="edubtns">' +
          '<button class="btn" id="eduDocs">서류·전화</button>' +
          '<button class="btn" id="eduCopy">복사</button>' +
          '<button class="btn primary" id="eduSms">문자 보내기</button>' +
        '</div>' +
        '<div class="actions"><button class="btn" id="closeModal">닫기</button></div>';
      document.getElementById('modal').classList.add('open');
      eduFill_(tr, base, false);
    }
    function eduCopy_() {
      var ta = document.getElementById('eduMsg');
      if (!ta) return;
      var txt = ta.value || '';
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(txt).then(function () { toast('복사했어요'); },
            function () { eduCopyFallback_(ta); });
          return;
        }
      } catch (e) {}
      eduCopyFallback_(ta);
    }
    function eduCopyFallback_(ta) {
      try {
        ta.focus(); ta.select();
        var ok = document.execCommand('copy');
        toast(ok ? '복사했어요' : '길게 눌러 복사해 주세요');
      } catch (e) { toast('길게 눌러 복사해 주세요'); }
    }
    function eduSms_() {
      var ta = document.getElementById('eduMsg');
      var tr = (DATA.trainees || [])[EDU.idx];
      if (!ta || !tr) return;
      var phone = String(tr.phone || '').replace(/[^0-9+]/g, '');
      if (!phone) { toast('전화번호가 없어요. 서류·전화에서 확인해 주세요.'); return; }
      location.href = 'sms:' + phone + '?body=' + encodeURIComponent(ta.value || '');
    }
    document.addEventListener('change', function (ev) {
      if (!ev.target || ev.target.id !== 'eduDate') return;
      var d = eduParse_(ev.target.value);
      if (!d) return;
      EDU.date = ev.target.value;
      eduFill_((DATA.trainees || [])[EDU.idx], d, true);
    });

    /* v14: 산모 이름 → 근무표 기준 카드체크 일수·날짜별 내역 모달 */
    function openMother(idx) {
      var it = DATA.items[idx];
      if (!it) return;
      MODAL = { kind: 'mother', key: it.mother };
      // v34: [배정정보] K열에 등록된 바우처 지역 (논산/계룡/부여/… · 일반)
      var asv = (DATA.motherAssign || {})[it.mother] || null;
      var vc = (asv && asv.voucher) || it.voucher || '';
      var vHtml = '<div class="vbadge' + (vc === '일반' ? ' none' : '') + '">바우처 ' + esc(vc || '미등록') + '</div>';
      var st = (DATA.motherStats || {})[it.mother] || null;
      // v19: 일수 집계가 아직 안 왔으면 잠깐 로딩을 보여 주고 바로 채웁니다.
      if (!st && !it.isNormal) {
        document.getElementById('sheetbox').innerHTML =
          '<h2>' + esc(it.mother) + '</h2>' +
          vHtml +
          '<div class="meta">' + nameHtml_(it.mother, it.caregiver) + ' 관리사 담당</div>' +
          '<div class="mnone" id="statWait">카드체크 일수를 불러오는 중…</div>' +
          '<div class="actions"><button class="btn" id="closeModal">닫기</button></div>';
        document.getElementById('modal').classList.add('open');
        loadStats(true);
        setTimeout(function () {
          var w = document.getElementById('statWait');
          if (w && MODAL && MODAL.kind === 'mother' && MODAL.key === it.mother) w.textContent = '일수를 불러오지 못했어요. 잠시 후 다시 눌러 주세요.';
        }, 8000);
        return;
      }
      var as = (DATA.motherAssign || {})[it.mother] || null;
      var days = (st && st.days) ? st.days : [];
      var total = st ? (st.totalDays || 0) : 0;
      var recs = st ? (st.records || 0) : 0;
      var months = [];
      if (st && st.byMonth) {
        for (var k in st.byMonth) if (st.byMonth.hasOwnProperty(k)) months.push(Number(k));
      }
      months.sort(function (a, b) { return a - b; });
      var head = months.length ? (months.join('월+') + '월 총 ') : '';
      var brk = [];
      if (months.length > 1) {
        var pp = [];
        for (var i2 = 0; i2 < months.length; i2++) pp.push(months[i2] + '월 ' + st.byMonth[months[i2]].days + '일');
        brk.push(pp.join(' · ') + ' · 기록 ' + recs + '건');
      } else if (months.length === 1) {
        brk.push('기록 ' + recs + '건');
      }
      if (as && (as.start || as.end)) {
        brk.push('배정 ' + (as.start || '?') + ' ~ ' + (as.end || '진행 중'));
      }
      var note = '', noteHtml = '';
      if (recs > total) note = '쌍둥이는 두 관리사가 같은 날 함께 체크하므로 하루로 셉니다.';
      else if (as && (as.care1 || as.care2)) {
        var cs = [], ch = [];
        if (as.care1) {
          cs.push(as.care1 + (as.days1 ? ' ' + as.days1 + '일' : ''));
          ch.push(nameHtml_(it.mother, as.care1) + (as.days1 ? ' ' + esc(as.days1) + '일' : ''));
        }
        if (as.care2) {
          cs.push(as.care2 + (as.days2 ? ' ' + as.days2 + '일' : ''));
          ch.push(nameHtml_(it.mother, as.care2) + (as.days2 ? ' ' + esc(as.days2) + '일' : ''));
        }
        note = '배정 관리사 ' + cs.join(' · ');
        noteHtml = '배정 관리사 ' + ch.join(' · ');   // v35: (카드만) 이름은 연한 색으로
      }
      var tp = todayParts();
      var rows = '';
      for (var j = 0; j < days.length; j++) {
        var d = days[j];
        var isToday = tp && d.m === tp.m && d.d === tp.d;
        var full = fullDate_(d);
        var cares = String(d.care || '').split(' · '), chips = '';
        for (var ci = 0; ci < cares.length; ci++) {
          var cn = cares[ci].trim();
          if (!cn) continue;
          chips += '<span class="chip"><span class="cn' + (cardOnly_(it.mother, cn) ? ' cardonly' : '') + '">' + esc(cn) + '</span>' +
            ((isToday || !isAdmin_()) ? '' : (function (k, d0, h0) {
              var armed = delArmed_(k);
              return '<button class="x' + (armed ? ' arm' : '') + '" data-del="1" data-armed="' + (armed ? '1' : '0') + '"' +
                ' data-date="' + esc(d0) + '" data-helper="' + esc(h0) + '" title="이 기록 지우기">' + (armed ? '삭제?' : '✕') + '</button>';
            })(full + '|' + cn, full, cn)) +
            '</span>';
        }
        rows += '<div class="mday">' +
          '<span class="dt">' + d.date + ' <span class="wd">(' + esc(d.dow) + ')</span></span>' +
          '<span class="chs">' + chips + (d.n > 1 ? '<span class="tag">2명</span>' : '') + '</span>' +
        '</div>';
      }
      var isNormal = !!it.isNormal;
      if (!days.length) rows = '<div class="mnone">' + (isNormal ? '일반 산모라 근무표 카드체크 기록이 없어요' : '아직 근무표에 체크된 날이 없어요') + '</div>';
      document.getElementById('sheetbox').innerHTML =
        '<h2>' + esc(it.mother) + (it.twin && it.groupSize > 1 ? ' <span class="twinmark">쌍둥이</span>' : '') +
          (isNormal ? ' <span class="nbadge">일반</span>' : '') + '</h2>' +
        vHtml +
        (isNormal
          ? '<div class="mcount">바우처 카드체크 대상 아님 · 앱에서 완료(☑)로 표시</div>' +
            '<div class="nnote">일반 신청 산모는 바우처 카드체크 대상이 아니에요.</div>'
          : '<div class="mcount">' + (total ? head + '<b>' + total + '</b>일 체크' : '근무표 체크 0일') + '</div>') +
        (brk.length ? '<div class="mbreak">' + esc(brk.join(' · ')) + '</div>' : '') +
        (note ? '<div class="mnote">' + (noteHtml || esc(note)) + '</div>' : '') +
        (as && as.end
          ? '<div class="mnote">종료 ' + esc(as.end) + ' · 보건소메일 ' + esc(sendText_(as.mail)) +
            ' · 종료안내문 ' + esc(sendText_(as.letter)) + '</div>'
          : '') +
        '<div class="mlisthead"><span>날짜별 체크</span><span>' + (days.length ? '최신순' : '') + '</span></div>' +
        rows +
        retroHtml(it, st) +
        '<div class="actions"><button class="btn primary" id="closeModal">닫기</button></div>';
      document.getElementById('modal').classList.add('open');
    }

    function closeModal() {
      MODAL = null;
      document.getElementById('modal').classList.remove('open');
    }

    /* ── v17: 지난 날짜 소급 추가 ─────────────────────────────────────
       그 날짜가 속한 달의 근무표에서 관리사 행 × 그 일자 칸에 산모 이름을 적고,
       시트에서는 그 칸 글자만 파랗게 표시합니다. (앱 화면에는 색 구분 없음) */
    function appYear() {
      var m = String((DATA.today && DATA.today.date) || DATA.dateLabel || '').match(/(\d{4})-/);
      return m ? m[1] : String(new Date().getFullYear());
    }
    function pad2_(n) { return (n < 10 ? '0' : '') + n; }
    function fullDate_(d) { return appYear() + '-' + pad2_(d.m) + '-' + pad2_(d.d); }
    function yesterdayStr() {
      var m = String((DATA.today && DATA.today.date) || DATA.dateLabel || '').match(/(\d{4})-(\d{1,2})-(\d{1,2})/);
      var base = m ? new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3])) : new Date();
      base.setDate(base.getDate() - 1);
      return base.getFullYear() + '-' + pad2_(base.getMonth() + 1) + '-' + pad2_(base.getDate());
    }
    /* 소급 날짜의 가장 이른 날 — 서버가 알려 준 [N월근무표] 달 중 가장 앞 달의 1일 */
    function minDateStr(st) {
      var earliest = 0, i, mm;
      var ms = DATA.retroMonths || [];
      for (i = 0; i < ms.length; i++) {
        mm = Number(ms[i]);
        if (mm && (!earliest || mm < earliest)) earliest = mm;
      }
      if (!earliest && st && st.byMonth) {
        for (var k in st.byMonth) if (st.byMonth.hasOwnProperty(k)) {
          mm = Number(k);
          if (mm && (!earliest || mm < earliest)) earliest = mm;
        }
      }
      if (!earliest) { var tp = todayParts(); earliest = tp ? tp.m : 1; }
      return appYear() + '-' + pad2_(earliest) + '-01';
    }
    function helperListFor(it) {
      var out = [], i, rows = DATA.items || [];
      for (i = 0; i < rows.length; i++) {
        if (rows[i].mother === it.mother && rows[i].caregiver && out.indexOf(rows[i].caregiver) < 0) out.push(rows[i].caregiver);
      }
      var as = (DATA.motherAssign || {})[it.mother];
      if (as) {
        if (as.care1 && out.indexOf(as.care1) < 0) out.push(as.care1);
        if (as.care2 && out.indexOf(as.care2) < 0) out.push(as.care2);
      }
      if (!out.length && it.caregiver) out.push(it.caregiver);
      return out;
    }
    function retroHtml(it, st) {
      if (it.isNormal) return '';
      if (!isAdmin_()) return '';   // v20: 보기 전용은 '지난 날짜 소급 추가' 영역 자체를 숨깁니다.
      if (RETRO.mother !== it.mother) { RETRO = { mother: it.mother, date: '', helper: '' }; }
      var helpers = helperListFor(it), opts = '', i;
      for (i = 0; i < helpers.length; i++) {
        opts += '<option value="' + esc(helpers[i]) + '"' + (cardOnly_(it.mother, helpers[i]) ? ' style="color:#9aa0a6"' : '') + (RETRO.helper === helpers[i] ? ' selected' : '') + '>' + esc(helpers[i]) + '</option>';
      }
      if (!RETRO.helper && helpers.length) RETRO.helper = helpers[0];
      return '<div class="retro">' +
        '<div class="rtitle">지난 날짜 소급 추가</div>' +
        '<div class="rrow">' +
          '<input type="date" id="retroDate" value="' + esc(RETRO.date || yesterdayStr()) + '" min="' + esc(minDateStr(st)) + '" max="' + esc(yesterdayStr()) + '">' +
          '<select id="retroHelper">' + opts + '</select>' +
        '</div>' +
        '<button class="rbtn" id="retroAdd">+ 소급 추가</button>' +
        '<div class="rhint">그 날짜 칸의 산모 이름이 근무표에서 파랗게 표시됩니다. 어제까지 넣을 수 있어요.</div>' +
      '</div>';
    }
    function setRetroBusy(on, label) {
      var btn = document.getElementById('retroAdd');
      if (!btn) return;
      btn.disabled = !!on;
      btn.textContent = on ? (label || '저장 중…') : '+ 소급 추가';
    }
    function retroCall(date, helper, checked) {
      var mother = (MODAL && MODAL.kind === 'mother') ? MODAL.key : '';
      if (!mother) return;
      if (!isAdmin_()) { toast(VIEWER_MSG); return; }   // v20: 보기 전용 방어
      if (!date || !helper) { toast('날짜와 관리사를 골라 주세요'); return; }
      setRetroBusy(true, checked ? '추가 중…' : '삭제 중…');
      PENDING++;
      callApi({ action: 'retroCard', pin: PIN, date: date, mother: mother, caregiver: helper, checked: !!checked })
        .then(function (r) {
          PENDING--;
          setRetroBusy(false);
          if (!r || !r.ok) { toast((r && r.message) || '저장하지 못했어요'); return; }
          mergeServerStats(r, mother);
          RETRO.mother = mother; RETRO.date = date; RETRO.helper = helper;
          if (checked) toast(r.already ? (r.message || '이미 그 날짜에 기록돼 있어요') : '소급 기록을 추가했어요');
          else toast('기록을 지웠어요');
          refreshModal();
        }, function (e) {
          PENDING--;
          setRetroBusy(false);
          toast((e && e.message) || '저장하지 못했어요');
        });
    }
    /* ✕ 한 번 = '삭제?' 로 바뀌고, 5초 안에 한 번 더 누르면 지웁니다. */
    function armDelete(btn) {
      var date = btn.getAttribute('data-date'), helper = btn.getAttribute('data-helper');
      var key = date + '|' + helper;
      if (delArmed_(key)) {                 // 두 번째 누름 → 지웁니다
        DEL_ARM = { key: '', until: 0 };
        retroCall(date, helper, false);
        return;
      }
      DEL_ARM = { key: key, until: Date.now() + 5000 };
      btn.setAttribute('data-armed', '1');
      btn.classList.add('arm');
      btn.textContent = '삭제?';
      clearTimeout(btn._t);
      btn._t = setTimeout(function () {
        try {
          if (!delArmed_(key)) {
            btn.setAttribute('data-armed', '0');
            btn.classList.remove('arm');
            btn.textContent = '✕';
          }
        } catch (e) {}
      }, 5200);
    }
    document.addEventListener('click', function (ev) {
      var t = ev.target;
      if (!t || !t.closest) return;
      if (t.id === 'retroAdd') { var v = retroInput(); retroCall(v.date, v.helper, true); return; }
      var x = t.closest('.x[data-del]');
      if (x) { ev.preventDefault(); armDelete(x); return; }
    });
    function retroInput() {
      var dEl = document.getElementById('retroDate'), hEl = document.getElementById('retroHelper');
      return { date: dEl ? dEl.value : '', helper: hEl ? hEl.value : '' };
    }
    document.addEventListener('input', function (ev) {
      if (ev.target && ev.target.id === 'retroDate') RETRO.date = ev.target.value;
    });
    document.addEventListener('change', function (ev) {
      if (ev.target && ev.target.id === 'retroHelper') RETRO.helper = ev.target.value;
    });

    if (location.search.indexOf('diag=1') >= 0) {
      setTimeout(function () {
        document.body.style.width = '390px';
        setTimeout(function () {
          var rows = document.querySelectorAll('.row');
          var maxOver = 0;
          for (var i = 0; i < rows.length; i++) {
            var o = rows[i].scrollWidth - rows[i].clientWidth;
            if (o > maxOver) maxOver = o;
          }
          var bodyOver = document.body.scrollWidth - document.body.clientWidth;
          var d = document.createElement('div');
          d.id = 'diag';
          d.style.cssText = 'font-size:11px;color:#D93025;padding:6px 12px;background:#fff';
          d.textContent = 'DIAG rows=' + rows.length + ' rowOverflow=' + maxOver + ' bodyOverflow=' + bodyOver +
            ' lock=' + (document.getElementById('lock').classList.contains('hide') ? 'off' : 'on') +
            ' cachePaint=' + PERF.cachePaint + ' netPaint=' + PERF.netPaint + ' apiMs=' + PERF.apiMs;
          document.body.insertBefore(d, document.body.firstChild);
        }, 150);
      }, 150);
    }

    /* ── 시작: 기억해 둔 기기가 있으면 캐시로 바로 그리고, 뒤에서 조용히 최신화 ── */
    (function boot() {
      paintDots();
      var saved = readStoredPin();
      if (saved) {
        // v30: 직전에 보던 세 탭을 잠금 화면 없이 바로 그립니다. (0.1초 목표)
        var cached = readCache();
        if (cached) {
          setAll(cached.all.today, cached.all.ended, cached.all.upcoming);
          hideLock();
          renderPayload(START_TAB || cached.last || 'today');   // v36.1: 위젯이 지정한 탭 우선
          PERF.cachePaint = Math.round(nowMs_() - BOOT_T0);
        } else {
          lockMsg('확인 중…');
        }
        unlock(saved, true);   // 뒤에서 서버 검증 + 세 탭 최신 데이터로 조용히 교체
      } else {
        showLock('');
      }
    })();
  </script>
</body>
</html>
